[project]
name = "trainertwin-lore"
version = "0.1.0"
description = "Index captured posts and transcripts into one list"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gliner>=0.2.29",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "transformers<5",
]

[project.scripts]
trainertwin-pipeline = "pipeline.__main__:main"
trainertwin-social = "social.cli:main"
trainertwin-mcp = "pipeline.mcp:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "social"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
