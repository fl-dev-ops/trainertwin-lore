[project]
name = "trainertwin-lore"
version = "0.1.0"
description = "Index captured posts and transcripts into one list"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sarvamai>=0.1.34",
    "tqdm>=4.70.1",
]

[project.scripts]
trainertwin-pipeline = "pipeline.__main__:main"
trainertwin-social = "social.cli:main"
trainertwin-mcp = "pipeline.mcp:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "social"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
