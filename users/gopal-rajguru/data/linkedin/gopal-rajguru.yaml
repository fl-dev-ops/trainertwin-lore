  description: "Bacula Systems is the creator and purveyor of enterprise back-up and restore software supported by industry-leading\
    \ support. Bacula Enterprise Edition is a powerful back-up tool to protect critical organisational data from anywhere\
    \ to anywhere and restore. We provide a cost-effective solution for government and commercial organisations which enables\
    \ them to protect and secure their most important asset - their data - at predictable cost, even as the volume of data\
    \ grows. \n\nBacula Enterprise Edition is hardware agnostic - giving customers the flexibility to work with the vendors\
    \ they trust to secure their data - whether it's on-premise, off-site or in the cloud.\n\nAs a board member and co-founder,\
    \ my role is to support the leaders of this dynamic organisation to develop and deliver the most powerful, flexible and\
    \ cost-effective enterprise back-up software to its customers."
