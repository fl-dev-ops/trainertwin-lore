  publications:
  - title: The Crisis of the Salesperson (in German)
    publishedAt: Harvard Business Manager (Germany) · Aug 11, 2014
    publishedDate:
      text: Aug 11, 2014
      month: Aug
      year: 2014
    link: http://www.harvardbusinessmanager.de/blogs/warum-die-verkaeufer-schlechter-werden-a-984908.html
    description: 'This article discusses the reasons for the decline in sales professionalism observed by more than 500 business-to-business
      customer executives around the world and provides some insight into how to potentially stem the tide in your own organisation.
      The observation came about as a result of our 3rd market study conducted over the last 10 years. It surprised us as
      well - given the billions of dollars and euros companies invest in sales training. What became clear based on the more
      than 300 vendor interviews is that they know what to do... it''s just not being done! Please contact me if you would
      like an English version of this article by e-mail. '
  - title: Social Media and Lead Generation
    publishedAt: Infoteam Sales Process Consulting AG · Aug 10, 2013
    publishedDate:
      text: Aug 10, 2013
      month: Aug
      year: 2013
    link: null
    description: 'Recommendations on how to create and leverage your own social media profiles in a B2B context to improve
      lead generation based on findings from a survey of how 300+ B2B customers find information about new products and services
      to address their needs through social media, and which platforms they use; and how professional salespeople leverage
      social media to create their presence on-line and identify new prospects to create leads for new sales opportunities. '
