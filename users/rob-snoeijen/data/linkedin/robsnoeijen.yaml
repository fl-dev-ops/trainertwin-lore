  about: "Wil jij het maximale rendement halen uit jouw verkoopinspanningen? Ben jij op zoek naar de meest succesvolle verkooptechnieken?\
    \ Wil jij meer klanten, een hogere omzet en betere marges scoren?\nNeem dan contact met mij op via mail info@salestopics.nl\
    \ of bel me op nummer 06-38303214.\n\nVanuit mijn initiatief SalesTopics help ik (sales) professionals en bedrijven in\
    \ het verbeteren van hun commerciële rendement. Met veel enthousiasme weet ik mijn klanten te inspireren en motiveren\
    \ om te veranderen. Met Succes als Resultaat!\n\nMet meer dan 25 jaar verkoop- en managementervaring ben ik een sales-professional\
    \ pur sang te noemen. Als gecertificeerd trainer, coach, auteur, spreker en ondernemer help ik mensen om hun Sales Talent\
    \ te ontwikkelen. Vanuit mijn passie voor sales heb ik drie bestsellers geschreven: ‘Verras de Klant’, ‘Knuffel de Klant’\
    \ en 'Verleid de Klant’. Mijn Sales Blogs bij SalesOnline.nl en VerkopersOnline.nl, waarin ik commerciële beslissers interview,\
    \ zijn één van de best gelezen Sales Blogs van Nederland. Regelmatig geef ik lezingen, presentaties en workshops over\
    \ mijn visie op sales en klantgerichtheid. Mijn boeken vormen daarvoor de basis.\n \nMede door mijn creatieve en klantgerichte\
    \ aanpak ben ik in 2005 door de Sales Management Association (SMA) genomineerd als Key Account Manager van het jaar. Aan\
    \ de TFC Trainers Academy heb ik mijn SPHBO certificaat behaald voor de opleiding ‘Professional Trainer’. In mijn beleving\
    \ is het laten groeien van mensen en hun organisaties het mooiste wat er is.\n \nMijn motto is “Snoeijen doet Groeien.”\n\
    \nSpecialismen: Sales Training - Sales Coaching - Sales Consultancy - Sales Inspiration - Training Klantgerichtheid -\
    \ Beurstraining - Acquisitietraining - Account Management Training \n\n\nWil jij meer rendement halen uit je verkoopinspanningen?\
    \ Neem gerust met mij contact op via: info@salestopics.nl of door te bellen op nummer: 040-2240375. Ik help je graag verder!"
