    description: "Om ons gehele commerciële team en tegelijkertijd onze vernieuwde “Moteo - Visie en Values” beter toe te\
      \ passen en te ondersteunen hebben wij recent  vier trainingen van Rob Snoeijen gevolgd. Wij als importeur en onze branche\
      \ zitten midden in een transitie, stilzitten en afwachten past niet bij ons bedrijf Moteo Nederland B.V. \r\n\r\nVooraf\
      \ aan de trainingen heeft ieder teamlid een persoonlijk intake gehad, de vragen waren dusdanig prikkelend dat we vooraf\
      \ al wisten dat het geen saaie cursus zou worden! \r\n\r\nTijdens de trainingssessies zijn we actief aan de gang gegaan\
      \ om de kernwaarden en visie te vertalen naar dag tot dag bezigheden binnen de verschillende werkgebieden. Deze nieuwe\
      \ en ververste tools zijn praktisch vormgegeven, en worden nu in ieder zijn of haar dagdagelijkse expertise toegepast.\r\
      \n \r\nOndanks de verschillen tussen de diverse afdelingen die deelnamen aan de cursus; binnen en buitendienst, marketing\
      \ en directie, en ons werkgebied; gemotoriseerde tweewielerbranche en onze rol als importeur van o.a. diverse scootermerken,\
      \ heeft Rob onze toegevoegde waardes en de visie op een zeer prettige en duidelijke manier op ons netvlies gebracht.\
      \ Dit deed hij door tal van begrijpbare en interactieve oefeningen. Zoals bijv. niet alleen luisteren naar de trainer\
      \ maar luisteren naar elkaar, hiermee is een interessante verdieping gelegd binnen onze bestaande sales en marketing\
      \ “toolbox”. \r\n\r\nOpvallend is dat Rob iedere deelnemer op een verrassende en passende manier uitdaagt. Hij heeft\
      \ ons team op een praktische, interactieve manier getraind maar ook bij iedereen een blijvende positieve indruk achter\
      \ gelaten. Rob is hierdoor niet alleen voor ons salesteam een volwaardige sparringpartner maar ook voor de afdelingen\
      \ Marketing en Directie geweest.\r\n\r\nIk zou een training verzorgd door Rob Snoeijen zeker aanraden binnen mijn netwerk.\r\
      \n"
