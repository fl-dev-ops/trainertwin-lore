  - title: Verleid de Klant
    publishedAt: Van Duuren Media · 2013
    publishedDate:
      text: '2013'
      year: 2013
    link: http://www.verleiddeklant.nl
    description: 'Wil jij zakelijk onweerstaanbaar aantrekkelijk zijn? Kies dan voor verleiding. Klanten laten zich graag
      beïnvloeden. Het brein speelt daarbij een belangrijke rol. Uit onderzoek blijkt namelijk dat ruim 85% van het koopgedrag
      onbewust plaatsvindt. Dat biedt unieke kansen voor jou als ondernemer of (sales)professional. Want wie klanten op de
      juiste manier weet te verleiden, heeft een ijzersterke overtuigingsstrategie in handen. En daarmee zet je jezelf flink
      op voorsprong.

      In Verleid de Klant geven Rob Snoeijen en Danielle de Jonge doeltreffende verleidingstechnieken en praktische tips om
      het koopgedrag van (potentiële) klanten op een positieve manier te beïnvloeden. Omdat verleiden een constant proces
      is, passeren alle mogelijke verleidingsmomenten de revue. Van een verleidelijke eerste indruk en verleidelijk taalgebruik
      tot offline en online verleiden. Duidelijk wordt hoe je je zintuigen, gedrag en commerciële vaardigheden optimaal inzet
      om onweerstaanbaar te zijn voor je klanten. Mogen we je verleiden? Lees dit boek!

      '
  - title: Knuffel de Klant
    publishedAt: Mybusinessmedia · 2010
    publishedDate:
      text: '2010'
      year: 2010
    link: http://www.knuffeldeklant.nl
    description: 'Klantknuffelen is de nieuwe dimensie in klantbehoud en klantgroei. Het is de enige manier om je nog echt
      te onderscheidden in een tijd waarin enkel klanttevredenheid niet meer volstaat. Het is nu aan de ‘verkoper nieuwe stijl,
      de hugger, die naast het realiseren van een rationele betrokkenheid tussen klant en leverancier nu ook moet zorgen voor
      wederzijdse emotionele betrokkenheid.

      Klantknuffel is een bewezen filosofie met als doel klantverwachtingen steeds te overtreffen en daarmee klantgroei te
      realiseren. Dit boek geven Rob Snoeijen en Stephan van Gelder antwoord op de vraag hoe klantknuffelen werkt, hoe een
      organisatie haar huggers maximaal kan laten renderen en vooral hoe een klant geknuffeld kan worden. De combinatie van
      het grootschalige, een wetenschappelijke onderbouwing, unieke knuffelinterviews met toonaangevende organisaties en de
      vele praktische knuffelvoorbeelden van sales professionals uit het hele land, vormt een onuitputtelijke bron van inspiratie
      om trouwe klanten daadwerkelijk te transformeren tot oprecht enthousiaste ambassadeurs.

      '
  - title: Verras de Klant
    publishedAt: Mybusinessmedia · 2007
    publishedDate:
      text: '2007'
      year: 2007
    link: http://www.verrasdeklant.nl
    description: Wanneer heb jij voor het laatst je klant verrast met extra aandacht? Mensen worden blij van een onverwacht,
      attent gebaar. Zo ook klanten. Het is belangrijk je klanten steeds opnieuw en op een creatieve wijze te verrassen. Geef
      ze net iets meer aandacht dan ze verwachten. Doe altijd iets extra’s. kortom, Verras de Klant. Ervaar dat klanten jouw
      initiateven belonen, want jij bent immers diegene die opvalt. En daar gaat het om. Dit boek is bestemd voor iedere verkoper
      en verkoopmanager die iets extra’s voor zijn klanten wil doen. Met meer dan honderd prikkelende ideeën geeft het je
      voldoende mogelijkheden om een eigen creatieve en klantgericht aanpak te ontwikkelen. Ervaar hoe leuk en inspirerend
      – en vooral succesvol – het is om de inspiratietips uit dit boek in de praktijk toe te passen!
