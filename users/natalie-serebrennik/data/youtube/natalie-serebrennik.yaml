  description: "“I don’t do office politics”\n\n… is how you play small.\n\nI hear this all the time from leaders who work\
    \ hard, deliver results, and assume that’s enough.\n\nUntil…\n\nThey’re passed over for a promotion.\n\nThey watch someone\
    \ less qualified move ahead.\n\nThey realize – office politics exist whether you participate or not.\n\nYour biggest mistake\
    \ is thinking you can ignore them.\n\nInstead of fighting it, why not play on your own terms?\n\nI’ve coached 100+ leaders\
    \ how to play big in 3 simple steps:\n\n1️⃣ Build real relationships, not transactional ones.\n\n2️⃣ Make your work visible\
    \ without waiting for someone else to notice.\n\n3️⃣ Position yourself strategically, without compromising your integrity.\n\
    \nWhat if instead of labeling office politics as an ugly word, we saw it for what it really is:\n\nThe unspoken dynamics\
    \ that shape careers.\n\nOffice politics don’t have to be toxic.\n\nThey don’t have to feel like a twisted game.\n\nYou\
    \ can take control of the narrative and play on your own terms.\n\nThat’s how the best leaders play and win.\n\nWant support\
    \ doing this without overthinking it? \n\nBook a call and let’s chat. \n\nIf you like this, don't forget to follow me\
    \ for more."
