- id: 9y_pahPHzcY
  title: Essential Leadership Mindset Shift
  url: https://www.youtube.com/shorts/9y_pahPHzcY
  upload_date: '2025-01-30'
  view_count: 13
  description: "You don’t get to avoid hard if growth is your goal.\n\nBuilding my success at the bank was far from ‘easy.’\n\
    \n→ A woman in a sea of men\n→ Constantly advocating for my worth\n→ Saying yes to roles that terrified me\n→ Battling\
    \ imposter syndrome behind a smile\n\nStarting my own business was equally challenging.\n\n→ Questioning my value every\
    \ single day\n→ Speaking to many but is anyone listening?\n→ Worrying if my offer and content are good enough\n\nAnd I\
    \ can’t forget:\n\n→ The gut punch I felt when I realized that to do what I love (coaching), I also had to wear many other\
    \ hats like digital marketing, accounting, ops, and don't get me started with IT\n\nAnd yet, I wouldn’t trade these challenges\
    \ for anything.\n\nWhy?\n\n→ Each hard pushed me out of my comfort zone\n→ Each hard opened doors I didn’t know existed\n\
    → Each hard taught me what I’m truly capable of\n\nI now approach new experiences with this mindset:\n\nHard is unavoidable.\n\
    \nThe question isn’t if you’ll face it. \n\nIt’s whether you’ll choose it for yourself or let someone else decide for\
    \ you.\n\nMy advice → choose for yourself.\n\nChoose the hard that stretches you.\nChoose the hard that aligns with your\
    \ goals.\nChoose the hard that’s for you and no one else.\n\nJust because the next step forward feels challenging doesn’t\
    \ mean it won’t come with the exact growth you need.\n\n\nSo, what hard are you choosing right now?"
