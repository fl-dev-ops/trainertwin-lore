    description: "I cannot recommend Diana enough.  Diana came into my life when I was 6 months into building my coaching\
      \ business.  For any newer entrepreneur you KNOW how overwhelming the first year can be!  While I was building clarity\
      \ and learning a ton on my own, I was left with that oh so familiar 'lost' feeling and questioning if I was doing anything\
      \ 'right'.  I craved direction and support from someone who truly understood me and what I was going through.  \n\n\
      Enter the fabulous Diana. \n\nFrom our first zoom call I was instantly drawn to her kind heart and valuable expertise.\
      \  She is one of the most genuine and thoughtful individuals I’ve ever met. \n\nFast forward 8 months and I can't tell\
      \ you enough how grateful I am that I took a chance and bet on myself.  Investing in Diana’s Luxury Retreat Mastermind\
      \ is an absolute no brainer for anyone looking to uplevel themselves and their coaching business.  \n\nHere are a few\
      \ of my favorite takeaways from the experience\n\n- First Class Support - she was incredibly generous with her time\
      \ and provided meaningful and customized support every step of the way. She has a brilliant knack for seeing your potential\
      \ and providing you the support to help you shine in your truest form.\n\n- Top Notch Teaching - she curated amazing\
