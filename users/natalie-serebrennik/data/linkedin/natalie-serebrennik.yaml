  about: "Hi, I’m Natalie \U0001F44B\n\nYou don’t know me (yet), but I promise you... you deserve the right to be selfish.\n\
    \nEspecially as a woman in corporate.\n \nOn the trading floor, I learned what it means to go after it and be all in.\
    \ \n\nUntil then, I was naive about the game being played. I thought working hard, keeping my head down, and trusting\
    \ my boss to advance me was all I needed.\n \nTruth is, young Natalie was just grateful for the opportunity to play in\
    \ the same arena as the boys.\n \nSo asking for more? That felt too needy.\n \nI waited and hoped instead.\n \nThen I\
    \ watched peers land promotions ahead of me, performing at a similar level, and it hit me: \n\nIf you're not selfish,\
    \ you're on the sidelines.\n \nOn the trading floor, I didn't just survive. I traded futures - one of the fastest moving,\
    \ highest notional value products in the market. That's where I learned what real risk looks like. \n\nAnd I learned that\
    \ playing it safe costs more than you think.\n \nWhen I began to own my authentic selfish, magic happened:\n \n> Promoted\
    \ to Sr. Director. \n> Secured six-figure increases in my bonus. \n> Recognized with the Executive Leader award. \n> Led\
    \ mentorship circles for future leaders in banking.\n \nYou deserve unlimited attempts to fight for your ambition and\
    \ I'm here to teach you the skills to do it successfully.\n \nReady to break through your mid-level stuck? Let's talk:\n\
    \ninfo@natalieserebrennik.com\nwww.natalieserebrennik.com\n\nLooking forward to meeting you :)"
