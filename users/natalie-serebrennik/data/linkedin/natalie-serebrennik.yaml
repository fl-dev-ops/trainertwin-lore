    description: 'Before working with Natalie, I struggled to find work after being unemployed for over two years. I wanted
      to pivot into a career that aligned with my passions, but I had no idea how to make the shift. With no strong network
      and no success through job postings, my confidence had hit rock bottom. I had worked with other career coaches before
      but felt like I was going in circles, getting assessments that told me what I was good at - but not how to land a job.


      Natalie changed that. Her coaching gave me clarity, a real strategy, and the skills to expand my network and unlock
      new opportunities. I now feel confident in interviews, know how to position myself as the ideal candidate, and no longer
      feel the anxiety that once held me back.


      Unlike other coaches, Natalie doesn’t take a ''one-size-fits-all'' approach. Her coaching is tailored, efficient, and
      focused on what actually moves the needle. Her guidance, structure, and resources have been invaluable, and I’m so grateful
      for her support!'
