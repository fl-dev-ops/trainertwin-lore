  about: 'Years ago, I was told not to go near the people actually using the product we were building. Everyone talked to
    their managers.


    So I went and found them. They were lovely. They also hated what we''d built, and were very happy to explain why. What
    we changed after that got more use than anything else we did. I''ve been a bit suspicious of the official version of a
    problem ever since.


    I think that''s the thread through 20 years of startups, new product teams and big transformations. I like the problem
    behind the problem. I don''t trust the first explanation, especially when it''s mine. I''ll ask why, then why again, until
    it gets slightly uncomfortable. Which can be annoying. I''m aware.


    It hasn''t always gone well. I''d usually get halfway through a transformation, want to change everything, and notice
    people had stopped listening to me. Then I''d get fed up and leave. Being right isn''t much use if no one will listen
    to you, so how will you make them listen? One of the best developers I''ve worked with once went quiet on me. My fault.
    That one taught me more than the wins did. Weirdly, all of it turned out to be good training for coaching.


    These days I''m a founder coach. Founders are my people, honestly. Logical builders, a bit stubborn. Some are stuck. Plenty
    aren''t. They''ve built something real, done well, and have a quiet suspicion there''s more in them. That takes some bravery
    to admit. It''s how they lead. Growing into that is hard to do alone. There''s nobody above you asking how you''re doing.


    Working with me: I''m direct, but calm about it. I''ll question the version of events you''ve got used to telling, kindly,
    because people only change their thinking when they can actually hear the question. Mostly I ask.


    The bit that fascinates me: the sensible thing to do is usually clear. (e.g. delegate it, have the conversation, stop
    putting it off). And yet... it doesn''t happen. That gap isn''t a knowledge problem, so another tactic won''t close it.
    That''s where Core Energy Coaching comes in. Call it personal development if you like. I think of it as finding the actual
    problem.


    If you''re logical, and there''s a problem you haven''t overcome but want to... then logically, you need to try a different
    approach. I''m a different approach.


    Start with the free Business Health Audit: about 5 minutes, results emailed, and a free 30-minute debrief with me if you
    want one. coachbevan.com/business-health-audit.html


    Or message me with the problem as it is. It doesn''t need to be tidy. Mine rarely are.'
