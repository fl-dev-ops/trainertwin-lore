  duration: 3 yrs 3 mos
  description: 'I worked for a fake startup (Skunkworks) within JLR. We were separate from central corporate structures and
    had the freedom to break things, get messy and win.


    Our goal was to offboard data in real time from all 2018+ Jaguar and Land Rover vehicles (~1m vehicles). This seemed impossible
    and previously data could only be offboarded via a cable when a vehicle went to a service centre.


    We built a cloud system to handle this and connected with the vehicles. The biggest technical challenge was the sheer
    quantity of data and transmutation could be astronomically expensive. We needed a system that took signal data and then
    updated the data packet requested in reaction to any anomalies.


    Real time data empowered Mechanical Engineering teams to provide rich user experiences (~£200m revenue), proactive diagnostics
    (~£400m cost saving) and  many other monetisable opportunities.


    I provided Product Leadership and strategic direction for the programme as a whole, and coached and led a team of 6 Product
    Owners.


    This fake startup programme was run as an experiment to see whether Product-led Agile methodologies could deliver better
    value for JLR. The programme was a huge success, resulting in a company wide transformation involving 3000 engineers wanting
    to use our methods.'
