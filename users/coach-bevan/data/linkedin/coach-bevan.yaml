  description: 'Once upon a time there was a young Product Owner called Bevan.


    He worked for a company that helped increase fuel efficiency in the logistics sector. They worked with Transport Managers,
    giving them data so they could manage their workforce better. Bevan tried with all his might to understand what else those
    Transport Managers might want. But it wasn''t working. He toiled in the trunking warehouses for many months. He was very
    tired. Until he had an idea.


    He wanted to ask the truck drivers. But they were very scary. With big teeth. And his manager said he wasn''t to go near
    them.


    So Bevan waited until very late, when his manager was sleeping, and snuck out into the truck drivers'' lair. He was a
    bit nervous. And a bit brave.


    The truck drivers weren''t scary at all. They were nice. And helpful. They were happy to be asked. One of them said Bevan
    could join him for a day out in the truck.


    The next day Bevan woke very early. It was still dark, and his manager was snoring. He washed his face. And snuck out
    to meet the truck driver. He rode up front in the big cab, and the driver told him about his life, his worries and what
    bothered him about driving.


    Bevan redesigned the interface with fonts the older drivers could read more easily, and usage went up. That opened up
    a whole new product. He had to tell his manager what he''d been doing. He was a bit nervous. But his manager wasn''t angry
    at all. He was ecstatic.


    Bevan took a prototype to the biggest customer in the industry. Their king sat in his lofty chair and watched the demo.
    Then he went very quiet. He was thinking. Then he opened his mouth to speak.


    "We''ll buy it... when can you deliver it?"'
