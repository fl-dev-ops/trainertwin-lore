  description: "Brixx was a startup. When I joined there were 8 employees, 1 product and 1 market. They had a tool that could\
    \ turn a set of accounts into a strategic financial plan, then stress test the plan against various scenarios. It was\
    \ cool. \n\nThey sold it to big social housing providers, who were forced by the regulator to provide 25 year financial\
    \ plans. They had to prove they had considered when and how to replace all the kitchens, roofs etc on any new development,\
    \ and existing property. Forced diligence. Useful.\n\nThe founder wanted to grow into a new market. So he sent me out\
    \ to research new potential markets. I spent a lot of time at conventions, learning about the struggles of various regulated\
    \ industries. I gained much useless knowledge.\n\nI happened upon Schools, that were about to embark on an Academy transformation.\
    \ They would be required to provide regular 3 year strategic stress tested financial plans. And the bursars at that time\
    \ were scared by the task and their ambitious headmasters. Our tool could solve their pain.\n\nThe founder loved it. I\
    \ worked with our engineers to customise our existing toolkit for Academies and to pre-fill their 3 year plan report.\
    \ The minimum spec required to solve the pain I had seen. \n\nI had some warm leads from the conventions and there wasn't\
    \ a comparable product on the market. It sold. I ran that product like my own mini business. I was sales, marketing, support,\
    \ training, product, and I recruited into the business."
