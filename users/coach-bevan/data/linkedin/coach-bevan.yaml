- position: Founder Coach
  location: United Kingdom
  employmentType: Self-employed
  workplaceType: null
  companyName: Coach Bevan
  companyUniversalName: null
  companyLinkedinUrl: https://www.linkedin.com/search/results/all/?keywords=Coach+Bevan
  companyId: null
  duration: 11 mos
  description: 'I coach founders who''ve done well and are pretty sure there''s more in them. Plenty are tech and product
    founders. Plenty aren''t.


    People usually come to me with something practical. The team. The workload. A hire they keep not making. That''s real,
    so we start there. But I rarely take the first explanation at face value, and there''s nearly always something behind
    it. Trust. Boundaries. Procrastination. Perfectionism. Imposter syndrome. A habit that was brilliant when it was just
    you and is now quietly getting in the way. That''s the bit worth solving.


    I ask a lot of questions. Some of them are awkward. I''m direct, but calm about it. If it lands like an attack, people
    defend themselves instead of thinking. I use Core Energy Coaching because it goes deeper than action plans, into the personal
    development side, which is where things start to move. You don''t need to arrive with a tidy problem. It doesn''t need
    to feel solvable.


    Who it''s for. Usually it''s the founder. Sometimes it''s someone in your team who''s stepping up, or your co-founder
    too.


    1:1 coaching is weekly or fortnightly, and includes an Energy Leadership Index (ELI) assessment. If it makes sense to
    bring the team in, we can add workshops and 1:1 coaching for the people in it, so the leadership development isn''t only
    happening in your head while everyone else wonders what''s got into you.


    Is it leadership coaching? Executive coaching? A bit of both, really, just pointed at founders, because nobody else is
    looking after a founder''s development. I want to create partnerships centred on continual growth.


    Want a starting point? The free Business Health Audit takes about 5 minutes: coachbevan.com/business-health-audit.html


    ACC (ICF) · CPC (iPEC) · ELI-MP'
