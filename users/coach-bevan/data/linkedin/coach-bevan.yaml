    description: 'I came to coaching because I have gremlins in my head, and they are oftentimes putting me in this little
      box making me feel small and worthless. I wanted to understand how I can shut them or up a little bit, so I can be better
      at what I do.


      Coaching was very interesting. I''ve never tried it before, and I was curious about how the process looks like and what
      do you actually get out of it. I was the one who had to go inwards, explore, and come up with my own insights. There
      wasn''t a recipe to how you do it or a clear structure. We just explored those gremlins. I tend to rush in real life,
      so I had to stop for a moment. I had to dig a little deeper into my reasons and patterns than I would alone.


      If you’re thinking of working with Bevan, I’d say, just go for it. Even if it sounds a little bit woo woo, if you have
      never done it, you must give yourself opportunity to try it, especially if you''re struggling with certain personal
      issues, personal issues that seep into business and that affect you in all areas of your life, just commit to a certain
      period of time, and have someone that will that will ask you deeper questions than you ask yourself. I highly highly
      recommend Bevan.'
