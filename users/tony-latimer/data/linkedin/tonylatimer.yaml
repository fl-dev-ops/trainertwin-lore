    link: https://icfcoachingfuturesreport.com
    description: 'This report does not predict a single future. Instead, it presents multiple scenarios that highlight both
      barriers and opportunities shaping access to coaching worldwide. Drawing on global insights, futures-thinking methods,
      and creative storytelling, we invite you to explore what coaching could become and how today’s actions shape tomorrow’s
      outcomes.


      The future is not fixed. Join this journey, expand your foresight, and help shape coaching’s role in a changing world.


      May this report challenge, inspire, and guide you, as a coach, leader, or change-maker, as we navigate an era of transformation
      together.'
  - title: Selling Yourself to Corporates - The 9 Actions® blueprint for coaches
    publishedAt: Profitable Leadership Publications · Jan 8, 2026
    publishedDate:
      text: Jan 8, 2026
      month: Jan
      year: 2026
    link: https://www.amazon.com/dp/B0G8JXML1S
    description: 'Let me be blunt. As a coach you will never earn the big bucks until you learn how to engage with corporates
      directly.


      It is one of the absurdities of our world that brilliant coaches often earn less than someone selling novelty socks
      online. Not because they lack talent, but because they were never shown how corporate buying really works.


      If you have ever wondered how to get corporate clients or how successful coaches build real corporate work, this story
      will show you a path that feels natural and aligned with who you are.


      Sell Yourself to Corporates takes you into the quietly revealing world of Arthur King. Through his journey you uncover
      the Nine Actions Blueprint and discover how selling can feel as natural as coaching.'
