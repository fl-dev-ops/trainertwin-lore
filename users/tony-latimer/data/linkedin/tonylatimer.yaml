  about: "70% of new CEOs fail.\n\nNot because they lack capability but because the role demands a level of clarity, decision-making,\
    \ and leadership that few have had to operate at before.\n\nThe first 12–18 months are critical.\nGet it right, and you\
    \ build momentum, credibility, and a leadership team that performs.\nGet it wrong, and recovery becomes exponentially\
    \ harder.\n\nI work with new CEOs and senior leaders stepping into larger roles to ensure they succeed in this transition.\n\
    \nOver the past 25+ years, I’ve coached CEOs and leadership teams across Asia-Pacific and globally through high-stakes\
    \ transitions, organisational change, and performance challenges.\n\nThe patterns I see are consistent:\n\t•\tLeadership\
    \ teams that aren’t actually operating as a team\n\t•\tTime lost in the wrong conversations\n\t•\tLeaders pulled into\
    \ operational noise instead of leading the business strategically\n\t•\tCapable leaders operating below the level their\
    \ role requires\n\nMy work focuses on three outcomes:\n\n1. CEO Transition Success\nHelping leaders step fully into the\
    \ role — thinking clearly, acting decisively, and leading with confidence.\n\n2. Leadership Team Performance\nTurning\
    \ a group of functional leaders into \"The team that runs the business\".\n\n3. Leadership at the Speed of Thought\nEnabling\
    \ leaders to create the time and clarity needed to operate strategically, not just reactively.\n\nThis work is delivered\
    \ through:\n\t•\t1:1 CEO coaching\n\t•\tLeadership team development and transformation\n\t•\tMasterclasses and keynote\
    \ sessions on Leadership at the Speed of Thought\n\nIf you are stepping into a CEO or business head role — or responsible\
    \ for ensuring those transitions succeed — and want to get it right from the start, get in touch.\n\nEach year I work\
    \ with a small number of experienced coaches who want to operate at this level — working with senior leaders in real organisational\
    \ contexts. If you are a coach and interested in bringing the highest level of mastery to your coaching clients come and\
    \ explore https://simplicityofmastery.com"
