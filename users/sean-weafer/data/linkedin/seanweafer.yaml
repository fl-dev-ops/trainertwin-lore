    description: "\nSales Training Course Testimonial\nWe recently completed a sales mentoring program delivered over several\
      \ online sessions; these were conducted by Sean Weafer from SalesMentor Pro. The course was extremely valuable and provided\
      \ a well-structured and practical approach to developing and improving sales skills.\nHaving the training delivered\
      \ across multiple sessions worked particularly well, giving us the opportunity to reflect on each topic, put the learning\
      \ into practice, and then build on it in subsequent sessions. Sean’s experience, guidance, and mentoring throughout\
      \ the course added real value, with practical insights and examples that could be applied directly to real sales situations.\n\
      The program was also fully supported by a comprehensive library of online videos. These provided an excellent resource\
      \ to reinforce the key concepts covered during the sessions and allowed us to revisit specific topics whenever needed.\
      \ \nSean also provided two weekly open forum drop-in sessions. These sessions allowed us to put Sean in the hot seat\
      \ by asking questions that were relative to current issues the team were having, and how best to manage them. \nOverall,\
      \ the combination of live online mentoring, practical learning, and an extensive bank of supporting video content made\
      \ this a highly effective and engaging sales development experience. I came away with greater confidence, a clearer\
      \ understanding of the sales process, and a range of practical techniques that I can apply immediately in my role.\n\
      Before the program was completed, one of our estimators was in the final stages of closing a deal, when he was challenged\
      \ by the client to reduce his rate by £9,000, falling back on his learnings from Sean, the estimator managed the client,\
      \ avoided offering any reduction, and secured the sale in the same day. By his own admission, before Sean’s mentoring,\
      \ he would have offered the full discount to secure the work.\nThis one step has completely paid for the course, and\
      \ we now have a team of 6 delivering the same results time and time again.\nI would highly recommend the course to anyone\
      \ looking to strengthen their sales skills and improve their overall sales performance.\n"
