  publications:
  - title: 'The Highly Trusted Advisor: How to Lead Teams and Win Clients in the Hybrid Age'
    publishedAt: SeanWeafer.com · Mar 17, 2021
    publishedDate:
      text: Mar 17, 2021
      month: Mar
      year: 2021
    link: https://www.amazon.com/Highly-Trusted-Advisor-Clients-Digital-ebook/dp/B08Z8MXFB8/ref=mp_s_a_1_1?dchild=1&keywords=the+highly+trusted+advisor&qid=1616177356&sr=8-1
    description: "In the hybrid world, people work both digitally remote  – and locally – live and from their offices – and\
      \ AI (artificial intelligence) is increasingly deployed to handle the transactional side of business. So, how do leaders,\
      \ executives, managers, professionals and sales teams remain of value in this new hybrid and AI-enabled age? \n\nThis\
      \ new age demands that executives and professionals invest even more in their communication and relationship skills\
      \ to remain relevant. They need to become better facilitators, collaborators, coaches, communicators, and advisors.\
      \ Instead of directing and dictating, they need to better connect with, involve, and understand their colleagues and\
      \ clients to create environments in which everyone can excel. \n\nIn The Highly Trusted Advisor: How to Lead Teams and\
      \ Win Clients in the Hybrid Age, Sean Weafer shows how to move from being an expert who relies on specialist knowledge\
      \ and technical competence as a leader or a salesperson to being a highly trusted advisor to your colleagues, team members\
      \ and clients – who rely on a set of enhanced communications and personal management or branding tools – to lead teams\
      \ to success or win in the modern game of selling. \n\nLearn how to use emotion as a powerful influencing tool, how\
      \ to build rapport and trust quickly with colleagues and clients, how to network live and digitally to project your\
      \ executive presence and brand, how to successfully manage and influence every meeting, how to create and present compelling\
      \ business messages, pitches and proposals, how to develop a laser focus for success, and how to regain control of your\
      \ time. \n\nThese skills – and more – are presented as a practical set of tools that allow any professional or executive\
      \ to survive and thrive in the new hybrid age of business. If you are looking for a manual to reach your professional\
      \ potential and success in this new hybrid world, then this is it."
  - title: 'C.A.S.H: Coaching As a Side Hustle'
    publishedAt: SeanWeafer.com · Nov 28, 2020
    publishedDate:
      text: Nov 28, 2020
      month: Nov
      year: 2020
    link: https://www.amazon.com/C-S-H-Coaching-Creating-Successful-ebook/dp/B08P8ZWQVP/ref=sr_1_1?crid=23QLZKBJ2FJC9&dchild=1&keywords=coaching+as+a+side+hustle&qid=1607682097&sprefix=coaching+as+a%2Caps%2C240&sr=8-1
    description: "If you’ve ever wondered what it takes to become a successful in-house business coach or to create a successful\
      \ coaching practice as an additional stream of income or (side hustle) then here it is. \n\nInternational executive,\
      \ leadership and business development coach, speaker and creator of the G2S coaching system, Sean Weafer, explains in\
      \ detail the secrets of what coaching is, why it works and what you need to do to turn your expertise into a thriving\
      \ coaching business or develop an innovative leadership skill.\n\nStep by step Sean - who has worked with executives\
      \ from global firms such as Microsoft, Oracle, Indeed.com, Grant Thornton and more - explains what coaching is, how\
      \ it evolved to be the business intervention it is today, what makes a successful coach and the steps that you need\
      \ to take to get there. \n\nMore importantly he explains why a successful coaching practice or skill is something you\
      \ can create while keeping your existing role, add as a new stream of income to your service business, use it to create\
      \ a successful retirement income or to develop an entrepreneurial and innovative leadership style when managing an internal\
      \ team. \n\nIf you’ve ever thought about becoming a professional coach, in the second fastest growth market in the world\
      \ today, then this book is for you."
  - title: Invoking the Feminine; Strength, Love and Wisdom
    publishedAt: SeanWeafer.com · May 1, 2019
    publishedDate:
      text: May 1, 2019
      month: May
      year: 2019
    link: https://www.amazon.com/Invoking-Feminine-Strength-Love-Wisdom-ebook/dp/B08Z8G7VJ9/ref=mp_s_a_1_1?dchild=1&keywords=invoking+the+feminine&qid=1616177244&sr=8-1
    description: "Through a young woman's grief for the loss of her mother she discovers an unexpected mentor in her father.\
      \ Through him she is introduced to a world that she never knew existed - one in which the Feminine is strong. \n\nWith\
      \ her father's guidance, an alternate path of reality is revealed to her and she finds strength in his wisdom and that\
      \ of the Divine Feminine through her conversations with the three aspects of the Feminine - the Maiden (or Warrior),\
      \ the Mother (or Healer) and the Crone (or Wise Woman - the Guardian of the Portal). \n\nOn her journey she discovers\
      \ not just a world of wonder but the nine keys to an inner strength within herself to face the world, deal with the\
      \ loss of her mother and rise once more immersed in the power of the Feminine."
