  about: "Seán is the founder of SalesMentor Pro and one of Europe’s leading mentors, educators and speakers in creating highly\
    \ trusted business advisors and leaders. \n\nWant to extend the capacity of a sales manager to build a high-performance\
    \ sales team - or as a business owner or practice professional do you want to be excellent at sales or as a ‘rainmaker’\
    \ but not be seen as ‘Salesy’ - or to transform more of your client conversations into business conversions? \n\nSalesMentor\
    \ Pro is a 90-Day mentoring program that bridges the gap from first contact to closing deals and winning the business\
    \ for Sales Teams, SME Owners and Practice Professionals for Professional Sales Teams, Business Owners and Practice Professionals\
    \ - not traditional sales training.\n\nTo maximise your revenue and income potential, just choose one of our programs\
    \ - all preceded by a complementary business Growth Mapping Session.\n\n01 Team - Sales Manager and Team Mentoring\n\n\
    Extend Your Sales Manager's Capacity and Increase Your Team's Performance.\n\nHave an expert mentor to work alongside\
    \ sales managers and their teams to improve capability, strengthen pipeline and convert more opportunities into business.\n\
    \nIt extends the manager's capacity through ongoing mentoring, team development, deal support and practical reinforcement.\n\
    \n02  SalesMentor Pro Professional - One-to-One Mentoring.\n\nTurn Your Expertise into a Competitive Advantage.\n\nThis\
    \ is tailored, individual mentoring for professionals and business owners with valuable expertise, strong relationships\
    \ and real opportunities - but want to turn more of those opportunities into business.\n\nWork directly on your pipeline,\
    \ your clients and opportunities with practical guidance, training, challenge and accountability tailored to your goals.\n\
    \nNext Steps? \n\nVisit SalesMentor.pro to book a complimentary Growth Mapping Session below to discover how to unlock\
    \ more of the sales capability in the business - either in you or the team. \n\nNo hard sell. Just a practical conversation\
    \ about growing you or your team's revenue."
