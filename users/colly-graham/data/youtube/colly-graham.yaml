- id: B5_b5kmqsd4
  title: Reframing Sales Objections
  url: https://www.youtube.com/watch?v=B5_b5kmqsd4
  upload_date: '2021-09-10'
  view_count: 177
  description: "Reframing Objections\r\nA frame provides a context or focuses for your thoughts and actions. Just as a picture\
    \ frame puts borders or boundaries on what you can see in a picture, the frames of reference that you choose as a result\
    \ of your beliefs about yourself and others, your perceived role in life, your perceived limitations in skills/abilities,\
    \ etc. can limit what you see as possible or can open up all sorts of possibilities. You (and if you allow them, others)\
    \ are continually setting timeframes, boundaries, limits, etc. on what you can and can’t do – often without any real thought\
    \ about the consequences or if the limitations are true.\r\nChanging the frame of an experience can have a major influence\
    \ on how you perceive, interpret and react to that experience. The purpose of reframing is to help a person experience\
    \ their actions, the impact of their beliefs, etc. from a different perspective (frame) and potentially be more resourceful\
    \ or have more choice in how they react."
  author: CollyGraham
