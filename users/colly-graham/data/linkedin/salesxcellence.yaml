  about: "Presence changes conversations.\n \nMost sales professionals don't struggle because they lack effort or skill. They\
    \ struggle because selling has become rushed, transactional, and pressured — and neuroscience tells us exactly why that\
    \ breaks down.\n \nI've spent 56 years in frontline B2B sales across 12 countries. I've been in the room where deals were\
    \ won and lost — not on features or price, but on how the brain responds to trust, emotion, and certainty.\n \nThat experience\
    \ — combined with my training under Richard Bandler as an NLP Master Practitioner and deep study of neuroscientists like\
    \ Kahneman, Damasio, and Huberman — became the foundation of everything I teach.\n \nI'm Colly Graham. Founder of salesxcellence,\
    \ BESMA Top 8 UK Sales Trainer, and keynote speaker on Winning Mindset for High Performance in an AI World.\n \nI work\
    \ with sales leaders, revenue teams, and conference organisers who want more than motivation — they want a methodology\
    \ that rewires how their people think, sell, and perform.\n \n✅ Keynote speaking — UK, Ireland, USA & Canada \n✅ Corporate\
    \ sales training — neuroscience-based frameworks \n✅ AI prospecting & CRM performance programmes \n✅ The Brain-Based Sale\
    \ methodology\n \n\U0001F4E9 To book a keynote or training conversation: colly@salesxcellence.com"
