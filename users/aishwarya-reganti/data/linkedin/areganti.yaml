  - title: Joke On Point! - Neural Joke Generation using Pointer-Generator Networks
    duration: Jan 2019 - Apr 2019
    startDate:
      month: Jan
      year: 2019
      text: Jan 2019
    endDate:
      month: Apr
      year: 2019
      text: Apr 2019
    associatedWith: null
    associatedWithLink: null
    description: Neural networks have been widely applied to a variety of natural language tasks. However, their application
      to creative language generation has been limited so far. While current state-of-the-art neural models produce unprecedented
      quality of jokes, they are still far from human quality. We identify two major drawbacks in existing joke generation
      models namely - syntactic correctness and semantic coherence and take small steps to better them. We use a pointer-generator
      network and multi-task learning with the primary objective of predicting a word at the current time-step and secondary
      objective of predicting the Part-Of-Speech (POS) tag for the next time-step. Our model outperforms the state of the
      art on the given dataset in the domain of joke generation.
