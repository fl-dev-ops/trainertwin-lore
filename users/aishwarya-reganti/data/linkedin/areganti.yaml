  projects:
  - title: 'Capstone: Designing Code-Mixed Goal Oriented Conversation Systems for Hindi Movies (Advisor: Prof. Alan Black)'
    duration: Jan 2019 - Dec 2020
    startDate:
      month: Jan
      year: 2019
      text: Jan 2019
    endDate:
      month: Dec
      year: 2020
      text: Dec 2020
    associatedWith: null
    associatedWithLink: null
    description: 'Code mixing/switching (for the scope of this project, we use the two terms interchangeably) is the phenomenon
      of mixing two or more languages in speech/text communication. Over the past few years, code mixing has become the default
      code of communication in geographical regions like India where there is a high percentage of multilingual individuals.
      Although state-of-the-art conversational systems and language models produce good quality monolingual utterances, they
      struggle with code-mixed data generation because of lack of data compounded by the increased confusability about the
      language structure and switching points. In this work, we aim to focus on building a goal-oriented Hinglish (Hindi and
      English code-mixed) dialogue system trained on data curated from code-mixed conversations about Hindi movies. We also
      aim to make the system more socially engaging and context-aware as compared to mainstream conversational agents. The
      contributions of our work include: (i) developing a new corpus for code-mixed movie conversations, (ii) building language
      models that can generate grammatically correct code-mixed utterances and finally, (iii) compiling an end-to-end goal-oriented
      dialogue system that can have engaging conversations about Hindi movies with prospective users.

      '
    contributors:
