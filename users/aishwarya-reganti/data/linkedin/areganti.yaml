  - title: Semantic Interpretation of Aggression from Code-Mixed Social Media Posts
    duration: Jan 2019 - Apr 2019
    startDate:
      month: Jan
      year: 2019
      text: Jan 2019
    endDate:
      month: Apr
      year: 2019
      text: Apr 2019
    associatedWith: null
    associatedWithLink: null
    description: 'In recent years, aggressive posts on social media have grown substantially which has serious implications
      for all social media users. While many previous research works have looked at aggression detection for monolingual data,
      there are very few works for code-mixed data. In this paper, we address the challenge of automatically identifying aggression
      in code-mixed (Hinglish) social media posts. We present a novel hierarchical attention model for aggression classification.
      The model outperforms the state-of-the-art for this task and also helps improve the explainability of classification. '
