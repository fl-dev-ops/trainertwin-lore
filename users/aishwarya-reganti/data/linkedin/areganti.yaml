  - title: Multimodal Video Summarization
    duration: Jan 2019 - Apr 2019
    startDate:
      month: Jan
      year: 2019
      text: Jan 2019
    endDate:
      month: Apr
      year: 2019
      text: Apr 2019
    associatedWith: null
    associatedWithLink: null
    description: State of the art text summarization models work notably well for standard news datasets like CNN/DailyMail.
      However, they struggle to produce reasonable results with new domains like video transcript summarization. This can
      be attributed to the drastic shift in sentence and summary structures. Moreover, most summarization systems do not use
      multimodal attributes which have proved to help produce better output quality in other similar language tasks. In this
      project, we develop a multimodal summarization model using the How2 instructional video dataset using two successive
      summarization components, an extractor that extracts key summary sentences and an abstractor that paraphrases key sentences
      coherently. We use RL based policy update method to fine tune these components. Our model obtains a ROUGE-L of 47.3,
      which is an improvement over other tried pointer-generator based models. Human evaluation shows that our model is able
      to produce summaries containing key information from the video transcripts using video features
    contributors:
