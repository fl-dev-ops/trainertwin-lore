- id: OsPma0BWq9c
  url: https://www.youtube.com/watch?v=OsPma0BWq9c
  title: Jev Explained in 12 mins (Without the Hype)
  upload_date: '2026-09-24'
  description: 'Everyone''s suddenly talking about a model called Jev. People are calling it 200x faster and 500x cheaper
    than a normal LLM and some are even calling it the end of expensive AI models. So I wanted to actually dig into what it
    is, instead of just following the hype.


    🔔 Join our next Applied AI cohort, taught by me and an OpenAI lead. Use YT25 for 25% off:

    https://maven.com/aishwarya-kiriti/genai-system-design?promoCode=YT25


    Quick version: Jev isn''t a language model in the way GPT or Claude are. It doesn''t generate text token by token. It''s
    built by a company called Typesafe, and instead of writing sentences, it just picks from a fixed set of outputs: a choice,
    a score, or a probability. That''s it. That''s the whole thing. And because the output space is so small, it can run way
    faster and way cheaper than a regular LLM, since it''s not stuck generating one token at a time.


    I go through what it can actually do (choosing between options, scoring something, or estimating a probability), show
    some real examples people have built with it such as browser automation, spreadsheet classification, an "AI slop" detector
    for websites and then get into where it falls apart. Typesafe''s own docs admit it struggles with arithmetic, counting,
    multi-step reasoning. So this isn''t a general-purpose model replacement. It''s more like a very fast, very narrow decision-maker
    that sits next to your LLM, not instead of it.


    Chapters:


    00:00 Jev Explained: Beyond the Hype

    00:40 What Is Jev? Structured Decisions vs LLM Generation

    01:41 Jev Outputs: Choices, Scores and Probabilities

    02:32 Why Jev Can Be Faster Than LLMs

    03:29 Jev vs Traditional Machine Learning Classifiers

    03:59 Jev Demos: Browser Automation and Spreadsheets

    05:57 Jev Limitations: Why It Does Not Replace LLMs

    07:54 Using Jev for Agent Routing and Orchestration

    08:35 AI Evals with Jev: The AI Slop Detector Demo

    10:15 Hybrid AI Architecture: Jev and LLMs Together

    11:09 Get Started with Jev: API Keys and Agent Skills


    I also show how to set it up yourself at typesafe.ai if you want to play around with it — there''s even an agent skill
    file that scans your codebase and suggests where you could swap in Jev to cut costs.


    Bottom line: Jev isn''t replacing LLMs. It''s a different kind of tool for a narrower kind of problem, and knowing where
    that line is matters more than the hype either way.


