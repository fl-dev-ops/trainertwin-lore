  title: Social media and the age of AI misinformation | Aishwarya Reganti | TEDxJacksonville
  upload_date: '2025-03-17'
  description: 'Scroll through any social media network and you’re highly likely to encounter content created by artificial
    intelligence. Some of it, like the ubiquitous cat videos, will be cute and harmless. However, the same platforms that
    bind us together and create moments of communal joy and connection can also divide us through algorithmic radicalization.
    The ability of AI to produce deceptive information and create convincing fake content, combined with social media''s rapid
    dissemination capabilities, has dangerous implications for societal dynamics.


    As an AI researcher, Aishwarya Reganti is focused on the intersection of these two trends. She’s investigating how social
    media and AI are merging to escalate the risks of misinformation. She believes it’s crucial that we change our mindset
    from "believing what you see" to "believing what you verify,” and she offers strategies for navigating this complex landscape
    and promoting a more informed and resilient digital future.


    #AI #SocialMedia #Misinformation #MachineLearning #ArtificialIntelligenceAI #Artificial_Intelligence As an AI researcher
    and tech lead at Amazon, Aishwarya Reganti is a highly recognized industry expert at the forefront of AI and social media.
    Her work, which includes over 30 research papers published in collaboration with top universities such as Stanford and
    the University of Michigan, focuses on social media aggression, fake news detection, fact verification, and meme interpretation.Aishwarya''s
    thought leadership is evident in her frequent invitations to speak at industry and academic

    conferences. She also shares her expertise as a guest lecturer on AI topics at institutions like MIT andOxford. This talk
    was given at a TEDx event using the TED conference format but independently organized by a local community. Learn more
    at https://www.ted.com/tedx'
