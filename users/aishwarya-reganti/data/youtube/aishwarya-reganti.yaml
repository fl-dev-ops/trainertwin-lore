- id: Mv7eiQFQQ1E
  url: https://www.youtube.com/watch?v=Mv7eiQFQQ1E
  title: 2,000+ Hours of Learning Agentic AI System Design in 20 Minutes
  upload_date: '2026-10-22'
  description: 'Most candidates I interview for AI roles know what RAG, MCP, and tool calling are. What they struggle with
    is applying those concepts to a real business problem, or explaining what it takes to scale an AI system to production.
    That skill is AI system design, and it’s what separates the people who get hired from the people who just throw around
    terms.


    🔔 Join our next Applied AI cohort, taught by me and an OpenAI lead. Use YT25 for 25% off:

    https://maven.com/aishwarya-kiriti/genai-system-design?promoCode=YT25


    Link to my AI System Design Book: https://maven.com/aishwarya-kiriti/o/a05048


    I’ve interviewed hundreds of people for AI roles, first as a tech lead at AWS and now for my own company. In this video
    I walk through a five-layer framework you can apply to pretty much any production AI system, from scoping the problem
    to optimizing it once it’s live. I use one of the most common interview problems as the example: an AI customer support
    agent for an e-commerce company that answers help center questions, looks up orders, creates tickets, and escalates to
    a human when it’s not sure.


    The five layers are scope and assumptions, architecture, observability, production and ops, and optimization. For architecture
    I use a simple framework I created called KARC: what the system has to know, act on, remember, and how it all coordinates.
    The whole point is that every piece you add should trace back to an assumption you made about the problem. Interviewers
    can tell when you’re name-dropping fancy architectures without a reason.


    You’ll learn how to:


    Scope a problem before you touch the solution, including how much agency the system should have and how to make your assumptions
    explicit

    Design a starting architecture with KARC, from hybrid RAG for knowledge to tool design to the four types of memory

    Think through permissions, blast radius, failure handling, and trust boundaries for every tool your agent can call

    Decide what to log, which evals to build on top of those logs, and which should run online as guardrails versus offline

    Take a design to production by planning for scale, latency, reliability, freshness, and security

    Optimize an existing system for latency, cost, quality, and specific failure patterns, and know when added complexity
    (like multi-agent) is actually earned



    Time Stamps:


    00:00 A Five-Layer Framework for AI System Design

    01:21 Layer 1: Scope, Assumptions and Agent Autonomy

    04:25 Layer 2: Architecture with Know, Act, Remember, Coordinate

    05:01 Know: Design the RAG and Retrieval Pipeline

    06:36 Act: Tools, Permissions and Trust Boundaries

    08:36 Remember: Four Types of Agent Memory

    10:03 Coordinate: Connect Knowledge, Tools and Memory

    11:08 Layer 3: Observability, Logging and AI Evals

    14:07 Layer 4: Production Scaling, Reliability and Security

    16:38 Layer 5: Optimize Latency, Cost and Quality

    19:27 Practice AI System Design Interview Questions



    The bigger point: don’t memorize the customer support architecture. Take the questions from each layer, apply them to
    a different use case, and practice. I’ve also used this same framework on nine other common AI system design problems
    in a book, with solutions on my GitHub, so you can see how it plays out across different systems.


