  title: What It Takes To Succeed In Channel Sales With Marcus Cauchi
  upload_date: '20210622'
  description: 'One of the biggest challenges to scaling revenue is time. Your salespeople only have so much time. Using a
    channel sales model, instead of hiring more reps, you’d distribute your products via a channel partner that will market
    and sell the product for you.


    In this episode, I and Marcus will break down everything you need to know about channel sales, when doing so makes sense
    for your business and provide tips for people already into channel sales.


    Channel sales is a key component of business growth in just about every industry. So, be sure to tune in to this episode
    of Closers are Losers!


    In this episode, we cover:


    • Introduction  [00:00]

    • Overview on channel sales [02:28]

    • What do partners look for in a vendor [03:07]

    • Why you need a sales special forces unit [04:39]

    • Channel sales vs. direct sales [06:03]

    • Qualities of a great channel manager [07:53]

    • Things to do before getting hitched with partners [09:37]

    • Why do channel partnerships fail? [11:26]

    • Should you attract as many partners as possible? [13:41]

    • Advantage of channel sales partners in the new normal [15:00]

    • Channel sales as a career option [17:20]

