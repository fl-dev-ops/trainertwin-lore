  title: Almost Everything Modern Sales Teaches is Backwards.
  upload_date: '20260629'
  description: "His advice to every seller? \n\nQuotas. Champions. Gated content. CRM data. Almost everything modern sales\
    \ teaches you to rely on, Richard Spanier argues, gets the buyer's reality backwards.\n\nIn this episode of TheInquisitor\
    \ Podcast, Marcus Cauchi talks to Richard Spanier, author of Trust: Sales 2030 — A Field Guide to Frictionless Buying,\
    \ about why sales has a trust problem rather than a tech problem, and what a genuinely frictionless buying process looks\
    \ like in practice.\n\nThey cover why most CRM data is closer to fiction than fact, why quotas and leaderboards work against\
    \ trust, why \"champion\" is often the wrong word for the person helping you internally, and Richard's proposal to split\
    \ deal profit equally across every team member who touches an account rather than rewarding individual activity. Richard\
    \ even tells sellers to stop listening to their managers, and explains exactly why.\n\nKey lessons:\n\nWhy so much of\
    \ standard sales practice optimises for the seller's comfort rather than the buyer's trust\nBuyers do most of their research\
    \ before a seller is ever involved, so pressure-based tactics are solving a problem that no longer exists\nRisk, not pain\
    \ or budget, is the real factor stalling decisions\nGated content damages trust before a conversation even starts\nPipeline\
    \ stages built on hope rather than evidence produce forecasts that cannot be trusted\nRecommending a competitor when you\
    \ are the wrong fit generates stronger referrals than trying to win every deal\n\nAbout Richard Spanier:\n\nRichard Spanier\
    \ has 45 years of experience in sales and consulting, including 30 years selling in the telecommunications equipment industry.\
    \ He is the author of Trust: Sales 2030 — A Field Guide to Frictionless Buying.stry. He is the author of Trust: Sales\
    \ 2030 — A Field Guide to Frictionless Buying.\n\nUseful links:\n\nRichard Spanier on LinkedIn:https://www.linkedin.com/in/spandev/\n\
    Richard's book, Trust: Sales 2030:https://www.amazon.co.uk/Trust-Sales-Field-Frictionless-Buying-ebook/dp/B0H4MNL1HR\n\
    \nMarcus Cauchi on LinkedIn: https://www.linkedin.com/in/marcuscauchi/\n\n\n#B2BSales #SalesLeadership #Trust #SalesStrategy\
    \ #RevenueGrowth #BuyerExperience #SalesTraining #CRO #FrictionlessBuying\n\n00:00 Why Sales Has a Trust Problem, Not\
    \ a Tech Problem\n01:22 The Client Who Made Richard Rethink Everything\n04:57 Can You Hit Quota Without Pressuring Buyers?\n\
    05:50 Splitting Deal Profit Across the Whole Team\n07:04 What Happens to 650,000 SDRs When AI Takes Over\n10:39 The Statement\
    \ of Work Buyers Actually Trust\n13:01 Why Risk Beats Pain in Every Buying Decision\n15:02 The Real Meaning of \"Commission\
