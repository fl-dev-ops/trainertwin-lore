  title: Why Your Prospecting Fails Before the First Call | Peter Cleary & Tom Stearns
  upload_date: '20260602'
  description: 'Most sales teams have plenty of activity and not enough quality conversations. The problem usually starts
    before anyone picks up the phone.


    In this episode of The Inquisitor Podcast, Marcus Cauchi talks to Peter Cleary and Tom Stearns — co-authors of Graphic
    Sales: How to Build a Prospecting Playbook — about what a serious prospecting system actually requires: a well-built ICP,
    genuine pre-call preparation, post-call analysis that feeds back into the process, and the critical thinking that AI tools
    cannot replace.


    They cover why ICP definition is where most sales teams need to start, how AI-assisted prospecting broke one team''s conversion
    rates by eliminating the reasoning process, and what honest pipeline management actually looks like when leaders stop
    varnishing the forecast.


    The book teaches through illustrated comic strips drawn from real sales disasters — Aesop''s Fables for salespeople.


    Get the book: Graphic Sales: How to Build a Prospecting Playbook — available at all good bookstores.


    Connect with Peter Cleary and Tom Stearns directly for consulting, coaching, and team enablement.


    Subscribe to The Inquisitor Podcast for weekly conversations on commercial strategy, sales leadership, and what actually
    drives performance in scaling organisations.


    Chapters

    0:00 Introduction — Peter Cleary and Tom Sterns

    1:49 Why sales needs a mirror — the origin of Graphic Sales

    3:44 Real stories, real disasters — how the book''s comics work

    5:20 Honesty in sales — the cost of starting with a lie

    7:12 What salespeople don''t talk about: losses, team dependency, self-reflection

    8:27 Pre-call planning and the post-call debrief nobody does

    11:39 Culture, coachability, and what managers actually owe their teams

    13:04 Mapping the buyer''s internal journey and buying stage

    14:30 ICP and persona — why it''s the foundation of everything

    17:10 Making heroics unnecessary — good management and better judgement

    18:17 Understanding the buyer''s context before the first call

    19:18 Social and political risk — why functional-level prospecting isn''t enough

    21:38 SDRs, AI, and why critical thinking can''t be automated

    23:19 Haste vs speed — multi-threading and the handoff problem

    24:30 Pod structures and long-term account ownership

    26:22 Truth-telling upwards — what honest pipeline management looks like

    30:31 Anti-ICP: prospects who could buy but shouldn''t

    31:10 Prospecting for customers for life

    33:33 How the book turns a sales lesson into a scene

    36:10 Which chapter to discuss with your team first — and why

    38:41 AI in prospecting: the cautionary case study

    40:05 Treating buyers as outcomes, not transactions

    42:52 The core message: become the seller buyers are relieved to meet

    43:37 Closing advice — what to whisper to your 23-year-old self'
