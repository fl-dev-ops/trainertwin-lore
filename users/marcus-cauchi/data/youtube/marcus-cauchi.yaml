    \ sales organisation that creates long-term customer value, not just short-term pipeline.\nConnect with Andy Hough: https://www.linkedin.com/in/andyhough\
    \ | ISP: www.isp.uk.com\nConnect with Marcus Cauchi: https://www.linkedin.com/in/marcuscauchi | www.inquisitorpodcast.com\n\
    \n#SalesLeadership #B2BSales #SalesManagement #RevenueGrowth #SalesCoaching #GoToMarket #CEOmindset #FounderAdvice \n\n\
