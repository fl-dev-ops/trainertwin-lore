  title: 'From Challenger to Framemaking: Redefining Modern B2B Sales with Karl Schmidt'
  upload_date: '20260114'
  description: "Most B2B deals don’t end in “no”.\n\nThey die quietly.\nNo decision. No movement. No momentum.\n\nIn this\
    \ episode, Marcus Cauchi speaks with Karl Schmidt, one of the leaders of the research teams that helped 100s of companies\
    \ take advantage of the insights from The Challenger Sale.\n\nBuyers now do most of their thinking before they ever speak\
    \ to a salesperson. Buying committees have doubled. Information is everywhere. Confidence is not.\n\nThis conversation\
    \ explores why traditional sales approaches struggle in this reality, and why the best sellers are no longer pushing solutions.\
    \ They’re helping buyers make sense of risk, complexity, and internal politics.\n\nYou’ll hear:\n• Why decision confidence\
    \ matters more than solution confidence\n• The fears that quietly kill deals\n• How sellers unintentionally strip buyers\
    \ of agency\n• Why “no decision” is the real competitor\n• What framemaking looks like in real sales conversations\n\n\
    If you’re a founder, CEO, sales leader, or an aspiring top performer, this episode will change how you think about discovery,\
    \ deal reviews, and what it really means to help a customer buy.\n\nThis is not about tactics.\nIt’s about leadership\
    \ in the buying process.\n\nResources mentioned:\n• *The Framemaking Sale*\n• *The Challenger Sale*\n• *Noise* by Daniel\
    \ Kahneman\n\nChapters\n\n0:00 Introduction: Challenger to Framemaking  \n0:32 The Modern Buyer Journey  \n3:15 Navigating\
    \ Buying Committees  \n5:40 Selling in a New Economy  \n6:55 Metrics That Drive Behaviour  \n8:09 The Three Deal-Killing\
    \ Fears  \n10:37 Decision vs. Solution Confidence  \n12:28 The Seller as Buyer Facilitator  \n14:48 Anticipatory Buyer’s\
