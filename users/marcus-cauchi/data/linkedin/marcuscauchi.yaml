        width: 100
        height: 100
    description: 'Suzanne''s my wife. We''ve also worked together for years, so I''ve had plenty of opportunity to see just
      how good she is at what she does.


      She notices things I miss.


      Someone will say something in a meeting and she''ll pick up on it when everyone else has moved on. She''ll spot where
      the numbers don''t make sense, where people have different understandings of what''s been agreed, or where something
      that was supposed to happen simply hasn''t.


      And she''ll ask about it.


      She''s particularly good at getting underneath what''s really going on without making people feel stupid or putting
      them on the defensive. I''ve watched her challenge CEOs, sales managers and salespeople who were convinced they understood
      the problem. Sometimes what seemed obvious at the start of the conversation looks quite different by the end.


      She doesn''t just help people come up with better ideas. She wants to know whether those ideas are practical, who''s
      going to do what, and whether anyone''s actually following through.


      But there''s another side to Suzanne that I think matters just as much. She genuinely wants to see people do well, particularly
      founders finding their feet and people who are new to a role or starting out in their careers. She''s generous with
      her time and patience. She''ll help someone work through a problem they''re struggling with, ask the questions they
      haven''t thought to ask, and give them room to figure things out. She''s not interested in showing people how much she
      knows. She wants them to discover what they''re capable of and become better at doing it for themselves.


      She''s saved me from getting things wrong more times than I care to admit. I''ll be pursuing an idea and she''ll ask
      something that makes me realise I''ve overlooked an important detail, made an assumption or added complexity we don''t
      need. We disagree, often. Sometimes quite strongly. But I wouldn''t want to work with someone who just nodded along.


      She''s thoughtful, practical, persistent and cares whether the people she helps are genuinely better off for having
      worked with her.'
