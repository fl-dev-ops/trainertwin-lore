  about: 'I’ve spent more than 30 years selling and advising on sales, management and leadership. I’ve learned that capable
    people can make perfectly reasonable decisions based on information that turns out to be incomplete, misleading or simply
    wrong.


    The trouble is, you don’t always discover that until you’ve committed the money, hired the people or promised the results.
    And by then, changing course can be expensive.


    I’ve worked with businesses where the answer wasn’t more leads, better salespeople or another round of training. The problem
    lay in what management was measuring, rewarding or assuming. I’ve also seen how easily a business can mistake activity
    for progress, revenue for profit and confidence for evidence.

    None of that means the people involved are incompetent. Often they’re making the best decisions they can with what they
    can see.


    But what if different departments are each seeing something important that nobody has put together? Or the measures everyone
    is working towards are producing consequences nobody intended? That’s how businesses end up spending more money, working
    harder or taking greater risks without getting the results they expected.


    Before committing to a solution, it pays to establish what you’re relying on, how you’ve reached your conclusions and
    what evidence might change your mind. Not to prove anyone wrong, but to make decisions you can stand behind, with a clearer
    understanding of the costs, risks and alternatives.


    Suzanne and I work together because we notice different things, challenge each other’s assumptions and catch things the
    other might miss. Combining our strengths helps us compensate for our individual blind spots and weaknesses, giving our
    clients a clearer understanding of their situation and options.


    I’ve explored these questions through nearly 600 conversations on @TheInquisitor Podcast and in books including Make Heroics
    Unnecessary, The Price of Pipeline, Making Channel Sales Work and Partnerable. The more I learn, the less interested I
    become in assuming we have the answer before we’ve properly understood the question.


    I’d rather help someone avoid an unnecessary mistake, recognise a worthwhile opportunity or make a better decision than
    sell them a solution they didn’t need.


    How we succeed matters.'
