  description: "You can hit the target and still damage the business.\n \nRevenue can rise while margin falls. Growth can\
    \ look good while cash gets tighter. A big customer can make the board pack look better while creating too much dependence.\
    \ A senior hire can look like progress when the job itself is badly designed. An AI project can produce more while making\
    \ poor decisions faster.\n \nSuzanne and I work with founders, CEOs, CROs, CFOs, boards and investors when a commercial\
    \ decision matters enough that getting it wrong will be expensive.\n \nThat might be a growth plan, a senior hire, a forecast\
    \ the board is relying on, an acquisition, an AI project, a partner strategy, a major customer, or another round of investment\
    \ into something that may no longer deserve it.\n \nWe look at what the decision is really based on. What do we know?\
    \ What are we assuming? Where does the evidence disagree with the story? What would have to be true for this to work?\
    \ Who can commit, change course or stop? What can still be undone? What would tell us early enough that things are going\
    \ wrong?\n \nThen we ask a simpler question: how much should we commit now?\n \nSometimes the answer is all of it. Sometimes\
    \ less. Sometimes the better answer is to change the terms, get more evidence, wait, renegotiate or stop.\n \nWe are not\
    \ trying to make every decision smaller. We are trying to stop people committing more than the case can support.\n \n\
    That matters when things are going badly. It matters when things are going well too. A good result can make a weak assumption\
    \ look true. Then more money goes in, more people get added and the cost of being wrong gets bigger.\n \nOur job is to\
    \ help protect value before too much is at risk, and back bigger commitments when the case is strong enough.\n \nWe make\
    \ it harder for sunk cost, pressure, politics, incentives or old assumptions to make the decision for you.\n \nThe question\
    \ is: given what we know now, what should we do next?"
