    description: 'I went into the conversation thinking our biggest challenge was generating more conversations with potential
      customers. By the end, I realised that wasn''t the real issue. The deeper problem was that I understood my product far
      better than I understood my buyers. I could explain what WattNext does in detail, but I couldn''t answer some surprisingly
      fundamental questions about why people decide to buy, what changes inside an organisation immediately before they buy,
      who actually owns that decision, or why they choose us instead of doing nothing.


      The biggest shift Marcus created was helping me separate what my product does from why someone would actually spend
      money on it. I kept talking about organisational visibility, leadership alignment and our methodology. Marcus kept bringing
      me back to the commercial reality: who cares, why do they care, what happens if they don''t buy, and why now? That sounds
      obvious, but they''re very different conversations.


      There was a point where I realised I''d been looking at the problem almost entirely through the lens of the solution
      instead of through the buying journey. I spend a lot of time thinking about organisational systems. Marcus forced me
      to think about decision systems instead.


      Immediately afterwards I sat down with my business partner and my sales manager to talk it through and to try and answer
      the questions I''d struggled with.  So basically homework.


      What makes Marcus different is that he doesn''t let you hide behind intelligence, experience or a polished product.
      He has an unusual ability to keep asking increasingly simple questions until you discover the thing you can''t answer.
      Those gaps become impossible to ignore, but they also become incredibly actionable.


      The conversation never felt confrontational because the questions weren''t designed to prove me wrong. They were designed
      to expose assumptions I hadn''t realised I was making. By the end I could see exactly where the work needed to happen.


      If another founder asked me whether they should spend 90 minutes with Marcus, I''d tell them yes, provided they''re
      genuinely prepared to have their thinking challenged. If you''re looking for encouragement, there are easier conversations
      to have. If you''re looking to understand why customers buy, and why they don''t, you''ll probably leave with a very
      different perspective on your business than the one you arrived with.


      I think Marcus is particularly valuable for founders who have built a strong product but are finding that sales aren''t
      progressing as expected. Especially when the instinct is to improve the product, generate more leads or refine the pitch,
      when the real opportunity is to understand the buyer more deeply. He has a knack for exposing the difference between
      knowing your business and knowing your market.'
