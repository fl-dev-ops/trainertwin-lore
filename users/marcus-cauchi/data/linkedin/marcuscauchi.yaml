  description: 'What do you want to be better?


    More profitable sales? Growth that doesn’t keep getting harder? A forecast you can rely on? A team that delivers without
    constant intervention?


    Before you hire more people, increase marketing spend, restructure the sales team or invest in training, how confident
    are you that you’re fixing the right problem?


    Suzanne and I help business leaders establish what’s actually getting in the way.


    We look at what’s happening across sales, management and customer relationships. We examine the evidence behind the numbers,
    speak to the people involved and test whether the explanations hold up. Sometimes the numbers look encouraging until you
    examine what they’re costing the business. Sometimes the problem isn’t where everyone thinks it is. And sometimes what’s
    being proposed won’t address the cause.


    We’ve helped leadership teams reconsider which opportunities deserve attention, how their salespeople are managed and
    rewarded, how teams are organised and where time and money are being wasted.


    We''ve advised on changes to the sales team structure, management, ICP definition and commercial practices. When leadership
    implemented those changes, the business returned to profit within six months.


    We don’t assume that everything needs changing. Sometimes the right decision is to stop something, do less or protect
    what’s already working. We advise. The leadership team decides and implements.


    I’ve spent much of my career helping people improve how they sell, manage and make decisions. I’ve hosted The Inquisitor
    Podcast for more than a decade and written Make Heroics Unnecessary, Partnerable  and The Price of Pipeline.


    If you’re about to commit more time or money to improving commercial performance, might it be worth establishing whether
    the evidence supports what you’re planning to do?'
