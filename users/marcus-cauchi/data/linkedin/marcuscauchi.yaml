  publications:
  - title: 'Partnerable: How to Build Trusted Partnerships Others Hate to be Without'
    publishedAt: Laughs Last · Oct 18, 2026
    publishedDate:
      text: Oct 18, 2026
      month: Oct
      year: 2026
    link: https://www.amazon.co.uk/Partnerable-Company-Customers-Partners-Commercial-ebook/dp/B0HNH4THH6/
    description: "How to Build Trusted Partnerships Others Hate to Be Without\n\nThe partners you most want to work with have\
      \ a choice. Why should they choose you?\n\nYou may have an excellent product, capable people and an attractive partner\
      \ programme. You’ve recruited partners, invested in training and built a healthy pipeline. Yet some of your most promising\
      \ partners aren’t bringing you their best opportunities. Others generate revenue that looks impressive until you discover\
      \ what it costs to win, deliver and retain the customer.\n\nWhat if recruiting more partners is the last thing you should\
      \ be spending money on?\n\nThe problem could be closer to home. \n\nThe book includes practical tools you can use straight\
      \ away. The Partnerability Field Guide helps you diagnose the conditions affecting a relationship. The Transfer Test\
      \ checks whether people beyond your original contact can make sound decisions about working with you. The Partner Selection\
      \ Guide helps you assess which relationships are worth pursuing.\n\nStart with one partnership that matters.\n\nPerhaps\
      \ it’s one you’re considering expanding, one that’s disappointing or one your growth plans depend on. Examine what’s\
      \ working, what’s getting in the way and what needs to be true before you commit more resources.\n\nWith a foreword\
      \ by Jay McBain, Chief Analyst at Omdia, Partnerable is for the people deciding where partnership investment goes, what\
      \ deserves further support and whether the results can be trusted.\n\nBefore you ask another business to bet on you,\
      \ find out what would make that bet worth taking."
  - title: 'The Price of Pipeline: What Happened to the Pipeline You Already Paid For? '
    publishedAt: Laughs Last · Oct 11, 2026
    publishedDate:
      text: Oct 11, 2026
      month: Oct
      year: 2026
    link: https://www.amazon.co.uk/Price-Pipeline-Happened-Already-Commercial-ebook/dp/B0HN162V1Y/
    description: 'Your pipeline can look healthy while the revenue beneath it is far less certain than anyone admits. The
      demo went well. The proposal is out. Someone has put a percentage against it, and the business is now hiring, spending
      and planning against the number.


      Most of those signals tell you what the seller has done, not what the customer has done or what still has to happen
      inside their organisation.


      That''s where pipeline gets expensive. Deals slip. Discounts appear late. Forecasts miss. Finance plans against revenue
      that never arrives. Then somebody decides the answer is more pipeline.


      Before you pay for more, ask: how much of the pipeline you already bought deserves the confidence you are placing in
      it?


      The Price of Pipeline shows how seller activity gets mistaken for buyer commitment, and how a number grows more certain
      each time it is repeated, even when the customer has done nothing new. It helps you ask what the customer has actually
      done to justify believing the revenue will happen, which deals deserve more resource, and when to stop pursuing.


      It is for CROs, CEOs, founders, CFOs, sales leaders and investors who commit money, people and time against commercial
      information that has passed through several layers of interpretation.


      Pipeline gets expensive when confidence travels further than the evidence.'
  - title: 'Make Heroics Unnecessary: How Managers Build Teams That Perform Without Rescue'
    publishedAt: Laughs Last · Oct 11, 2026
    publishedDate:
      text: Oct 11, 2026
      month: Oct
      year: 2026
    link: https://www.amazon.co.uk/Make-Heroics-Unnecessary-Managers-Commercial-ebook/dp/B0HN23D344
    description: "If everything falls apart when you step away, you’ve built a dependency, not a team. \n\nWhen rescue works,\
      \ people learn where difficult decisions get made. Questions travel upwards. Capable people wait for answers they could\
      \ learn to find themselves. Your strongest performers become the people everyone relies on, while you spend more time\
      \ dealing with work that shouldn’t require you and less time doing the work that only you can do.\n\nEventually, the\
      \ same problems start coming back in different forms. Another late escalation. Another weak handoff. Another decision\
      \ waiting for approval. Another customer promise that needs rescuing. Another strong performer absorbing work that should\
      \ never have reached them.\n\nNever do someone’s thinking for them when helping them think would serve them better.\
      \ \n\nThat doesn’t mean refusing to answer questions, withdrawing support or leaving people to struggle. Sometimes the\
      \ right thing to do is give the answer, teach the skill, make the decision or step in before a customer or colleague\
      \ pays for the mistake. The skill lies in recognising what the situation requires and what your intervention is teaching\
      \ people to do next time.\n\nThe book helps you recognise when you’re building capability and when you’re creating dependency.\
      \ Learn how to make standards and decision rights clearer, help people use evidence and exercise judgement, improve\
      \ the way problems are raised and handed over, and stop your strongest people becoming permanent shock absorbers.\n\
      Make Heroics Unnecessary is for managers, founders and leaders who want strong performance without making themselves\
      \ indispensable. It is especially relevant if you’re spending too much time solving other people’s problems, watching\
      \ the same mistakes return or wondering why your team still needs senior intervention for decisions it should be able\
      \ to make.\n\nThe question isn’t how good you are at rescuing your team. It’s why they keep needing rescue, and what\
      \ you can change so they need it less."
