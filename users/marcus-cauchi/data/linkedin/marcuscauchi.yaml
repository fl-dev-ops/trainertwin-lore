    description: "I'm Tom Stearns and I help companies next-level their go-to-market teams.\n\nMy consultancy was 14 years\
      \ old when I took a month off to travel. That time away helped me see my business differently and I wasn't sure what\
      \ I wanted to do with it next.\n\nI was a bit stuck in my own head. I liked what I was doing but was a bit bored and\
      \ wanted to be sure the next 5-10 years were going to be fulfilling and challenging. I began a search for a coach and\
      \ came upon Marcus.\n\nAfter one discussion with Marcus, I was already seeing things more clearly, and differently!\
      \ He brought this fun yet challenging energy to our sessions. I also loved his philosophy on sales and how deeply he\
      \ understands the relationship with the customer. I was both learning how to next-level my business while also gaining\
      \ great insights on what I teach my own customers!\n\nMarcus certainly challenged me while simultaneously helping me\
      \ understand my true value. I felt much better about myself and what I had to offer. \n\nSuccess was almost immediate.\
      \ Within a month I had found and converted two opportunities into sales. And what was better is these were the kind\
      \ of challenging, stretching projects I wanted.\n\nIn one more month I was building a clear long-term strategy and plans\
      \ and additionally I had, and continue to have, too many leads to keep up with, but, thanks to Marcus, I've found additional\
      \ revenue streams and ways to accommodate all that business. \n\nI tapped into Marcus for a particular strategic thinking\
      \ need but Marcus brought and brings amazing selling skills. I teach people about selling but I learned volumes about\
      \ selling from Marcus! Anyone looking to next-level themself can benefit from Marcus's coaching. If you're in sales,\
      \ it's a no-brainer.\n\nHe's also available as a friend when you need him. I had a very specific situation I was dealing\
      \ with with a client and needed some advice fast. Marcus was there when I needed him most.\n\nIf you work with Marcus,\
      \ you're also going to have a lot of fun. He'll challenge you but you'll be laughing along the way."
