    description: "I started working with Marcus in April this year. At that stage, I was an ok salesperson, who, with little\
      \ experience and the required training, had moved into management assuming I could impart the lessons I learned to a\
      \ team. Realising my approach was shortsighted and was not delivering the desired results, we looked outside our organisation\
      \ for support. \n\nWorking with Marcus, I expected him to prescribe a sales methodology, perhaps even a playbook which\
      \ I would drill relentlessly with the team. In reality, the approach I was confronted with was far more profound. Rather\
      \ than studying the latest sales trends, he took a more reflective approach which began by studying the person in the\
      \ mirror. What were the bad habits, the blindspots, which prevented me from becoming the best version of myself. Because,\
      \ without having a strong self portrait of who I am, how can I be a leader of value. \n\nHis approach, while confronting,\
      \ is built on the foundation of trust and integrity. In a business environment which encourages short-sightedness and\
      \ deceit, Marcus coaching will teach you how to achieve the life you want, while being a decent person, and hitting\
      \ your targets along the way. In many ways, he is a sales coach, but in many more, he is a life coach, despite our mutual\
      \ dislike for the term. So, if you are entering the New Year and feel you are unhappy with aspects of your life, I would\
      \ implore you to reach out to Marcus, if only for a chat."
