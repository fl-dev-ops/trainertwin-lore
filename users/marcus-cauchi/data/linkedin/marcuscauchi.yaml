  description: "Author of Make Heroics Unnecessary. It’s about a problem I’ve seen throughout my career. \n\nGood managers\
    \ spending far too much of their time sorting out problems they’ve already sorted out before. They step in because something\
    \ needs doing. And often, they’re right to. But when the same problems keep coming back, fixing them again isn’t enough.\
    \ Why does the team still need rescuing? \n\nPerhaps people don’t have the authority to decide. Perhaps they lack the\
    \ information or experience. Perhaps the way the work is organised makes it harder than it needs to be. And sometimes,\
    \ being so good at helping means nobody else gets the chance to learn. \n\nThat’s what the book explores. How do you build\
    \ a team that can think, make sound decisions and handle problems without constantly needing you to step in? Because being\
    \ needed feels good. Being needed for the same things, over and over again, should make us curious.\n\nhttps://www.amazon.co.uk/dp/B0HN23D344"
