  description: 'Permaculture is a practical method of developing ecologically harmonious, efficient and productive systems
    that can be used by anyone, anywhere.

    Permaculture is about creating sustainable human habitats by following nature''s patterns. It uses the diversity, stability
    and resilience of natural ecosystems to provide a framework and guidance for people to develop their own sustainable solutions
    to the problems facing their world, on a local, national or global scale. It is based on the philosophy of co-operation
    with nature and caring for the earth and its people. Permaculture is not a set of rules; it is a process of design based
    around principles found in the natural world, of co-operation and mutually beneficial relationships, and translating these
    principles into actions.'
