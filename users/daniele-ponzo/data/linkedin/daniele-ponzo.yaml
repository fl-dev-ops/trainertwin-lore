  about: 'Work in IT or Tech and feel confident in your skills, but not always in English?


    You’re not alone.


    Many IT and Tech professionals I speak with tell me the same things:


    ⚠️They hesitate in meetings, interviews, or client calls


    ⚠️They don’t sound as senior or credible as they really are


    ⚠️They worry English is limiting their career growth, mobility, and salary


    And deep down, they know that if nothing changes, the best opportunities will keep going to someone else.


    I get it... because I’ve lived it.


    I spent 13 years working in IT, in international environments, leading teams and managing complex projects.

    I had the technical skills.

    I had the experience.

    But I also know what it feels like to hold back in English, and how frustrating that can be when your career depends on
    communication.


    That’s why I now help IT & Tech professionals communicate clearly, confidently, and credibly in English, so they can:


    ✅ Perform better in international roles


    ✅ Be taken seriously by managers, clients, and recruiters


    ✅ Access better jobs, promotions, and higher salaries


    I’ve combined my 13 years in IT with 8 years of English coaching to create a focused 10-week program designed specifically
    for professionals in tech, not for language students.


    We work on:


    Real-life IT scenarios (meetings, interviews, presentations, emails)


    The vocabulary and structures you actually need at work


    Confidence and clarity without wasting time on academic grammar


    This approach has already helped dozens of professionals stop overthinking English and start using it effectively in high-stakes
    situations.


    I’m also the author of Easy English for IT and the host of The Non-Native Leader podcast, where I share real stories of
    professionals building successful international careers as non-native English speakers.


    👉 If you want to understand whether your English is holding you back — and what to do about it — send me a DM with the
    word “ENGLISH”.


    Ciao,

    Daniele'
