  - title: 'An urban CSA in Ireland: model description, relationship with the wider agri-food industry and introductory exploration
      of its impact on the community'
    publishedAt: Agriculture in Urbanizing Society conference 2015 · Oct 8, 2015
    publishedDate:
      text: Oct 8, 2015
      month: Oct
      year: 2015
    link: https://www.cabidigitallibrary.org/doi/pdf/10.5555/20183029557
    description: "Short food supply chains and \"grow-it-yourself\"​ initiatives are constantly growing in Ireland in a context\
      \ of a factory-oriented agri-food industry. Alarming food scares have brought insecurity to the current food system.\
      \ This paper will describe the first urban CSA group in Ireland and explore its relation-ship with other alternative\
      \ initiatives, like rural CSA’s and urban community gardens. \n\nThis CSA initiative is described from the community\
      \ building aspect, the group strengthening techniques and the application of the \"consensus method\"​ which contribute\
      \ to making this a viable model. The effec-tiveness of a urban CSA comes from its focus on re-ducing food miles and\
      \ its ability to attract the right target of people who seek an alternative to an \"indus-try-minded\" food production.1\
      \ \n\nKeywords – Urban CSA; community-building; regen-erative food systems; viable group model. \n"
