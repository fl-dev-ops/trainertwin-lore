  projects:
  - title: Essential business communication skills in English - Fondimpresa/Forma-Tec
    duration: Jan 2025
    startDate:
      text: Jan 2025
      month: Jan
      year: 2025
    endDate:
      text: Jan 2025
      month: Jan
      year: 2025
    description: 'This program is designed to develop essential business communication skills in English, aligning with the
      competencies outlined in Fondimpresa''s "Competenze di base e trasversali" framework (Avviso n. 2/2023). The course
      focuses on enhancing professional interaction through structured learning in the following areas:


      - Mastering greetings, introductions, and self-introductions.

      - Using polite expressions for apologies, thanks, and clarifications.

      - Effectively requesting and providing information.

      - Applying standard phrases for immediate workplace needs and operational instructions.


      The course ensures a comprehensive approach, including practical application and assessment, to provide participants
      with skills they can immediately apply in their professional roles.'
