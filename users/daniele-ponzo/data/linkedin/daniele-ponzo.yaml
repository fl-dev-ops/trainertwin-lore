    description: 'This is the first Dublin city CSA project: CSA – community-supported agriculture involves establishing a
      relationship with a farmer for a growing season. It benefits both parties in that buyers get good quality food straight
      from the source (no middlemen) and the farmer gets a fair price for his or her produce. There is a sharing of the risk
      involved in producing too: typically members subscribe through a monthly direct debit system, and if a crop fails, the
      share will still be paid for. Another advantage for the grower is that a oneoff delivery of food to an agreed pickup
      point means they don’t have to spend too much time staffing a shop or market.'
