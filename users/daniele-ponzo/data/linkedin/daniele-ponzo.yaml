- schoolName: Colorado State University
  description: "Agroecology has a broad scope and includes many different meanings. The term has been used to describe an\
    \ interdisciplinary scientific field, to characterize a set of farming practices, and to name convergent social initiatives.\
    \ In this course we have identified their common root (the agroecological lens) and learned how to use it as a transformative\
    \ tool for social and environmental justice. The agroecological lens has been used to reflect step by step, traversing\
    \ perspectives from a narrow scope (the field) to the broadest level (the food system). \nThroughout this process, diverse\
    \ themes ranging from soil care to food sovereignty have been explored. Case studies from initiatives around the globe\
