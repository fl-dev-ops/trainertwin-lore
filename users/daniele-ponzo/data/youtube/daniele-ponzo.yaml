  description: "Speaking English at work can be intimidating, even when you're an experienced software engineer. But what\
    \ if the biggest challenge isn't technical English, but everyday conversations with international colleagues?\n\nIn Episode\
    \ 40 of **The Non-Native Leader Podcast**, I sit down with **Alina Kulish**, a Ukrainian front-end software engineer now\
    \ living in Bulgaria, to explore how she moved from fear and anxiety in English meetings to greater confidence, professional\
    \ growth, and international connections.\n\nAlina remembers preparing written notes for every daily stand-up, worrying\
    \ that colleagues wouldn't understand her, and even avoiding joining meetings early because she was afraid of making small\
    \ talk.\n\n**How do you build confidence when English isn't your first language but your career depends on using it every\
    \ day?**\n\nHer journey goes far beyond language learning. From leaving a career in finance to becoming a software engineer,\
    \ relocating from Ukraine because of the war, and balancing motherhood with professional ambitions, Alina has learned\
    \ how to turn challenges into opportunities.\n\n**In this conversation, we explore:**\n\n- Why small talk can be harder\
    \ than technical English for software engineers.\n- How fear of making mistakes affects communication in international\
    \ meetings.\n- Understanding different English accents, cultural differences, and workplace humour.\n- How Alina improved\
    \ her speaking confidence through real conversations, speaking clubs, and documentaries.\n- Why learning English should\
    \ be enjoyable rather than another stressful obligation.\n- Building a personal brand on LinkedIn while working full-time\
    \ in tech.\n- The power of mentoring, sharing knowledge, and connecting with international professionals.\n- Practical\
    \ advice for overcoming language anxiety and developing an international career.\n\nOne of the most powerful messages\
    \ from Alina's story is that **you don't need perfect English to communicate, connect with people, and grow professionally.**\n\
    \nYou need opportunities to practise, a willingness to make mistakes, and an approach to learning that you actually enjoy.\n\
    \nWhether you're a software developer, IT professional, tech lead, project manager, or any non-native English speaker\
    \ working in an international company, this conversation offers practical insights and inspiration for communicating with\
    \ greater confidence.\n\n\U0001F4AC **YOUR TURN:** Have you ever avoided speaking during a meeting or joining a call early\
    \ because you were worried about your English? Share your experience in the comments!\n\n**⏱️ CHAPTERS**\n\n00:00 Teaser\
