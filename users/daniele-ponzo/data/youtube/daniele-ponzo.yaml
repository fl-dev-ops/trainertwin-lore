  speaker_count: 1
  speakers:
    '1': Speaker 1
- id: Bt2w2oT_IZ0
  title: 'Moving Abroad: The Expectation vs Reality #shorts'
  url: https://www.youtube.com/shorts/Bt2w2oT_IZ0
  upload_date: '2026-09-23'
  view_count: 45
  description: 'Visiting a country and living there are two completely different experiences.


    Camila loved Colombia as a visitor. But when she moved there to lead an organisation, she faced resistance, loneliness
    and a reality that did not match her expectations.


    Living abroad is not Wonderland. It will reveal challenges that no classroom or business trip can prepare you for.


    The reward comes from learning how to respond when the dream becomes real.


    Watch the full conversation: https://youtu.be/qFXy-2LkJmc


