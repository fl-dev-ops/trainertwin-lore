- id: DQvGMnBGlO8
  title: How to Build Confidence in Tech as a Non-Native Speaker | Humanizing Tech | Episode 13
  url: https://www.youtube.com/watch?v=DQvGMnBGlO8
  upload_date: '2024-05-21'
  view_count: 38
  description: 'How do you build confidence in tech when you''re working, communicating and even teaching in a language that
    isn''t your first?


    In this episode of The Non-Native Leader, I speak with Maryia Tuleika, Test Automation Lead and tech educator based in
    Stockholm, Sweden, about the human side of working in technology.


    Maryia''s journey goes far beyond software testing and engineering. She shares what it was like to adapt to a new country,
    learn Swedish, communicate in an international workplace and eventually step into a classroom to teach software engineering
    to people from very different professional and linguistic backgrounds.


    We explore an important question for international tech professionals:


    Technical knowledge matters — but what happens when you need to explain that knowledge clearly, build relationships, teach
    others and communicate confidently across languages and cultures?


    In our conversation, we discuss:


    overcoming language barriers in international tech environments


    building confidence when speaking a second or third language at work


    teaching software engineering to non-engineers


    explaining complex technical ideas clearly


    adapting to a new workplace culture


    learning through teaching and knowledge sharing


    becoming more confident when presenting in another language


    the importance of patience when developing communication skills


    using small, consistent learning habits instead of chasing overnight improvement


    why human skills still matter in an increasingly AI-driven technology world


    Maryia also shares how supportive colleagues helped her move from frustration to confidence when learning Swedish — and
    how language eventually became a way to understand the culture around her rather than simply a professional requirement.


    If you''re a software engineer, developer, IT professional, tech leader or non-native English speaker working internationally,
    this conversation is a reminder that career growth isn''t only about becoming technically stronger.


    It''s also about learning how to communicate your knowledge, connect with people and make your expertise accessible to
    others.


    In this video:

    00:00 Introduction

    01:32 Meet Maryia: Test Automation Leader & Educator

    07:46 Why Teaching Helps You Learn

    09:24 Teaching Software Engineering to Non-Engineers

    11:36 Overcoming Language Barriers in Tech

    18:26 Why Patience Matters

    22:17 Becoming a Confident Speaker in Another Language

    27:20 Start Small and Grow

    30:00 Humanizing Tech in the Age of AI


    👉Linkedin: https://www.linkedin.com/in/daniele-ponzo

    👉Check my website: www.danieleponzo.com

    👉Book a free chat with me: https://calendly.com/daniele-ponzo/en...

    👉Get my FREE eBook: https://solutionspeak-coaching.ck.pag...



    🎙️ The Non-Native Leader explores the stories of international professionals who have built successful careers across
    languages, countries and cultures.


    Subscribe for conversations about Business English, communication skills, international careers, leadership, confidence
    and working in global teams.


    #NonNativeEnglish #TechCareers #CommunicationSkills


    Music credits: Riccardo Frosoni and Giuliano Frammartino'
