- id: HZCbe-MgEDo
  title: 'Laugh, and the world laughs with you; weep, and you weep alone... #podcast #internationalcareer'
  url: https://www.youtube.com/shorts/HZCbe-MgEDo
  upload_date: '2024-07-24'
  view_count: 458
  description: "Laugh, and the world laughs with you; weep, and you weep alone...\n \nSmiling and laughing are really powerful,\
    \ on so many levels:\n\n\U0001F642 Improve learning: studies show that humour activates the brain’s dopamine system, which\
    \ stimulates goal-oriented motivation and long-term memory.\n\n\U0001F642 Help to relax: laughing reduces stress and anxiety,\
    \ creating a better learning environment, especially when it comes to languages.\n\n\U0001F642 Enhance confidence: when\
    \ you make people laugh (using a different language), it means you’re connecting on a higher level and you’re using your\
    \ full personality.\n\nThis extract below shows one of my favourite moments of my conversation with Matteo Giusti, an\
    \ Italian academic in England, who told me about his turning point with the English language.\n\nConnect with people through\
    \ humour.\n\nAnd find your true self in a different language by making people laugh.\n\nWhat do you think? Do you like\
    \ laughing in English? What’s your favourite joke?\n\nHere is the full video: https://youtu.be/GPfiYf2F8ZE?si=puwMJzDQ_E8C196Z\n\
    \n#academicenglish #interview #speakbetter #nonnativeenglishspeaker #podcast #languageskills #englishlanguage"
