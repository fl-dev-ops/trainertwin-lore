  view_count: 2
  description: 'Business owners, organisations, sales leaders, and sales people all share one common challenge – finding effective
    ways to gain access to their ideal future customer and then determining how to provide tangible value, so that the customer
    raises their hand and a business relationship can be formed. Many organisations adopt the hope and pray strategy, where
    they use multiple marketing channels to spread the word, hoping that some of the ‘mud’ sticks. One of the most effective
    channels to leverage is LinkedIn, but, unfortunately, many do not use it to its fullest potential. In today’s episode,
