  description: 'In sales, the temptation to launch into the product and service pitch early in the sales process can sometimes
    be overwhelming, especially when there is direct or implied pressure being applied to hit a number. This can lead to the
    seller being focused more on what is in it for them, rather than being focused on what is in it for the buyer. The end
