- id: vpgIAd_zpj4
  title: Are You Investing In Your Sales Team?
  url: https://www.youtube.com/watch?v=vpgIAd_zpj4
  upload_date: '2024-07-15'
  view_count: 3
  description: 'With 2 working weeks left until the end of the Financial Year (or end of Quarter if your company has a different
    Financial Year), many companies are scrounging to get the deals closed as quickly as possible – to hit the number by the
    end of the month.




    Often, as a result of this, the focus is ‘all hands to the pump’, meaning that other activities and investments take a
    back seat, or are discarded altogether. If the activity or investment is not directly related to closing deals by June
    30th, it is not a priority. And unfortunately this is often the directive from Senior Management which sets the tone for
    the entire team, resulting in short term, immediate attention. We must resist this and continue to invest in the sales
    team.'
