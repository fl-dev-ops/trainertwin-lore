      \ thinking flexibility to differentiate between big picture and detail and knows when the appropriate time is to use\
      \ both/either.\r\n\r\nHe is the type of person who relishes working with people, and whilst he is comfortable working\
      \ in isolation to plan and strategise, he does get great satisfaction through working with and through teams. He is\
