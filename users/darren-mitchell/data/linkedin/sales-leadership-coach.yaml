  - givenBy: Walter Nasreddine
    givenAt: September 16, 2015
    givenByLink: https://www.linkedin.com/in/walter-nasreddine-837b8a7
    givenByHeadline: Acquisition Sales-Senior Specialist, ICT and Cybersecurity  at Telstra
    givenByPicture: null
    description: "I would like to share the experience I had with Darren Mitchell and the coaching he provide me over the\
      \ last 12 months. \r\nMy role at Telstra is a Senior Network Solution Specialist and the portfolio covers a range of\
      \ high profile customers in the Mining, Utilities and Petroleum industry. \r\n \r\nPrior to my engagement with Darren,\
      \ I had gone through the previous financial year at Telstra feeling frustrated within in my account portfolio. Although\
      \ I had worked just as hard as previous years, I just had my worst sales result in the 7 years of being at Telstra,\
      \ missing my individual target for the first time.\r\nFurthermore I was starting to lose the passion for the industry\
      \ and work in general. \r\nBy Chance I walked past Darren's desk and although I knew Darren was a General Manager at\
      \ Telstra in the Enterprise and Government section. Darren managed a large team of sales and technical people, I had\
      \ never worked directly for or with Darren. \r\nI said \"what do you do these days\" the reply was \"Coaching and Development\"\
      \r\n \r\nWhether it was timing or luck, This was my chance to take the opportunity and ask for some much needed coaching\
      \ and mentoring. It was one of the best decisions I have made in recent times at Telstra.\r\nOver the last 12 months\
      \ Darren and I would meet once a fortnight. During the first few months the focus was about my profile as a person first,\
      \ who I was and what I stood for both personally and professionally. This wasn't just about work and achieving target,\
      \ the coaching was much deeper, it was about life and core values. \r\nOnce we had established this, Darren started\
      \ focusing on the professional side of my role within the organisation. As a General Manager he understood that Corporate\
      \ organisations like Telstra also require individuals meet a certain level of Key Performance Indicators.\r\nThe coaching\
      \ sessions started to focus on understanding my colleagues and  the customer. The bench mark was set to \"World Class\"\
      . What does a World Class professional IT person look like? \r\nThe sessions would focus on making sure that future\
      \ customer engagement would address solving both political and business issues my customers where experiencing. Rather\
      \ than focusing on Telstra or technology. "
