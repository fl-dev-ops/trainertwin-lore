      \ may have initially attended a workshop under ’sufferance’. Vasilis is a very strong facilitator and moderator, and\
      \ focuses on creating an experience for people in group sessions to drive change and innovation. And like all great\
      \ facilitators, he recognises and understands that he is the least important person in the room, which creates an environment\
      \ of humility where new concepts can be explored without judgement or prejudice.\r\n\r\nVasilis possesses outstanding\
      \ communication capabilities, whether it be through the written word, through verbal language, or non verbal. He is\
      \ very open in his communication, and comes from a position of curiosity and non judgement, which puts people at ease\
      \ and creates an environment which encourages them to share their ideas, insights and perspectives without fear of criticism.\
      \ He is very articulate in how he communicates, which I believe stems from his ability to think deeply and from multiple\
      \ perspectives, and when he communicates, he does so with precision and clarity. As such, he is able to build trust\
      \ and credibility quickly with his stakeholder audience.\r\n\r\nVasilis also has a terrific sense of humour, and whilst\
      \ he is very focussed on delivering the best outcomes for his key stakeholders, he does not take himself too seriously.\
      \ As such, there is a ‘lightness’ to his personality and approach which is engaging and comforting, especially for stakeholders\
