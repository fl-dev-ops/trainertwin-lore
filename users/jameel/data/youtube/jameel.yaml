  title: Top 5 Supply Chain Disruptions and Disasters of 2024 - A Deep Dive with the Financial Impact
  url: https://www.youtube.com/watch?v=fC1sUhHjlXU
  duration: 00:13:08
  upload_date: '2024-12-30'
  view_count: 762
  description: '2024 presented significant challenges to global supply chains. In this video, we analyze the 5 most impactful
    disruptions, examining their root causes and cascading effects:


    Russia-Ukraine War:


    Disrupted energy markets, leading to soaring fuel costs and impacting transportation.

    Impacted critical raw material supplies, causing production slowdowns.

    Created economic uncertainty and increased geopolitical risks.

    Red Sea Crisis:


    Increased shipping costs by 20-40% due to rerouting and higher insurance premiums.

    Led to significant delays in global trade, impacting industries reliant on timely delivery.

    Contributed to increased economic uncertainty and disrupted global trade flows.


    Southeast Asia Floods:

    Devastated infrastructure, impacting transportation and manufacturing.

    Disrupted agricultural production, leading to food shortages and price increases.

    Estimated billions of dollars in economic losses across affected countries.


    Panama Canal Drought:

    Disrupted transportation routes, damaged infrastructure, and impacted agricultural production.

    Led to increased transportation costs and potential supply chain bottlenecks.

    Contributed to significant economic losses in the region.


    CrowdStrike Glitch:

    Widespread IT outages caused significant operational disruptions across various sectors.

    Led to significant financial losses due to downtime, lost productivity, and remediation costs.

    Heightened concerns about cybersecurity vulnerabilities within critical infrastructure.

    This video provides valuable insights into the challenges facing global supply chains and the importance of building resilient
    and adaptable supply chain networks.


