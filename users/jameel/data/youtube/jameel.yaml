  description: 'Are tariffs good or bad for supply chain jobs? In this video, I break down the real impact of tariffs on global
    trade, the economy, and career opportunities for supply chain professionals. 🚢📦


    We’ll cover a brief history of tariffs, two examples where tariffs actually helped the economy (like the early U.S. tariffs
    from the 1790s and India’s post-independence policies), as well as famous tariff cases including the Chicken Tax of the
    1960s. On the flip side, I dive into two major tariff failures: the Smoot-Hawley Tariffs of the Great Depression and the
    Steel Tariffs imposed by President Bush and later by Trump.


    Finally, I’ll share the key skills supply chain professionals need to survive and thrive during this tariff era, including:


    Sourcing & Supplier Diversification


    Risk Management & Negotiation Skills


    Manufacturing & Project Management


    Planning & Transformation Leadership


    Regulatory Compliance


