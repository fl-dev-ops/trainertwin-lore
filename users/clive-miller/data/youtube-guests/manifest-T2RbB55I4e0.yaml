  title: Pitch The Solution Early And They Stop Needing You (Clive Miller)
  upload_date: '20261106'
  description: 'Clive Miller is the founder and managing partner of SalesSense, a UK sales consulting, coaching and training
    firm he started in 1996 for companies that sell complex B2B solutions.


    Clive decided he wanted to be the one at the front of the room at his very first sales training course in 1979, on the
    Bayswater Road in London. It took him twenty years to get there. In between he sold and ran channel sales at Sun Microsystems
    and Silicon Graphics and was the international sales effectiveness manager at Blackboard. Since founding SalesSense he
    has built a library of free assessments, guides and courses on the SalesSense website, including the CLEAR approach and
    a 14 statement Win Predictor for qualifying deals. In this conversation, Clive explains why a complex sale is closer to
    project management than to persuasion, why you should never talk about the solution too early, and why selling is simply
    helping people do what they want to do.


    Expect to learn why filling the pipeline is the struggle most firms share, how to get two herds of cats on the same page,
    the three rules behind CLEAR, the four levels of sales qualification, whether great salespeople are born or made, how
    to run an email campaign that people do not block, why sales training is the first budget to be cut, what CRMs are really
    for, and much more…


