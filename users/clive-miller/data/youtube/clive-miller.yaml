- id: sSsWaC06JF4
  title: Lands End Airport (St Just) and a Sea Landing
  url: https://www.youtube.com/watch?v=sSsWaC06JF4
  upload_date: '2022-02-26'
  view_count: 50
  description: Fly with me on a short sightseeing circuit taking off from Lands End Airport in the amphibeous Grumman G44
    Eidgeon. Take in the breathtaking realism of the scenery as I turn above Senan Cove, Land in the sea off Lands End, swing
