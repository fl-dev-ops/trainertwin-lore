  title: Brentor Dartmoor Gliding in a Super Demona
  url: https://www.youtube.com/watch?v=DAVC4DIEUjE
  upload_date: '2022-03-19'
  view_count: 98
  description: Fly with me on a short flight from Brentor Airfield in the Diamond Super Dimona powered glider. A short flight
