  title: Top Salespeople Interviewed - John Bycroft
  url: https://www.youtube.com/watch?v=8mSBnmBVqoU
  upload_date: '2021-08-19'
  view_count: 75
  description: John Bycroft is a veteran top sales performer. Transitioning from Cobolt programming, he sold Olivetti branch
    automation solutions to banks and building societies in the UK. He was so successful that Olivetti had him set up a global
