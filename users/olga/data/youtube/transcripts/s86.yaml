  text: >-
    Our objection handling process, it's clarify, discuss, diffuse. We are not getting into objection
    handling mode, pitching features and benefits, trying to convince the client that whatever he's saying
    is wrong because we're going to ask. The same as our mom or dad or husband or wife is trying to convince
