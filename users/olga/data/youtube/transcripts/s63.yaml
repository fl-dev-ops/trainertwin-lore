  text: >-
    Instead of thinking of what you should say to make the client buy, focus on what you should ask, because
    the right question will lead the client to their own conclusion. Like for example, um what make you
    start thinking of uh buying the property now? The answer of this question is the client telling himself
    why he should buy now, and it's more powerful than any sales speech that you can deliver.
