  text: >-
    So, neuroemotional persuasion technique is a methodology where instead of you jumping up and down,
    pitching, convincing, you ask the right questions, you notice my tone, right? The right tone, and
    the person from his own mouth to his own ears, going to do what? Sell himself. You don't have to sell
    anything. He's going to do this job. Because let me ask you this, who you yourself going to believe
    more? Your mom is telling you to do something or you telling to yourself to do something? I'm taking
    an example of the mom for a reason because that's probably the only one person in the world you think
    is taking your best interest in mind.
