  speaker: '1'
  text: >-
    Dubai property prices dropped almost fifty percent in less than a year. I'm talking about two thousand
    eight. Could the same thing happen again in twenty twenty six? And at first glance, the similarities
    around are uncomfortable. Record prices, then off-plan frenzy, buyers rushing into the market because
    they're afraid of missing the next increase. But the mechanism underneath today's market is completely
    different.
- t: "00:00:30"
  speaker: '1'
  text: >-
    In two thousand eight, the market was built on credit. Buyers were getting up to ninety percent finance.
    And flippers were reserving properties with very small deposits. Then lending stopped. Not only in
    Dubai, all over the world. The buyers did not simply become cautious. They disappeared. Today, most
    purchases are cash. Mortgage lending is restricted and offline is regulated. So,
- t: "00:01:00"
  speaker: '1'
  text: >-
    the risk is not identical, but that doesn't mean that there is no risk. In the full video, I explain
    what could actually pressure Dubai property prices in this cycle.
