- id: mbEs7oWD2dE
  title: Why is the Client is giving you the Money Objection?! 💰
  url: https://www.youtube.com/shorts/mbEs7oWD2dE
  upload_date: '2024-09-08'
  view_count: 1000
  description: 'Why is the Client giving you the Money Objection?! 💰

    Why is he saying it''s ''too expensive'' ?


    Often, the issue boils down to either:

    Logistical Issue - I do not have the money now

    Surprise - He really Has no Money Period - not much you can do for them

    Value Issue - that means that whatever you have done during your sales process - and specifically the presentation - makes
    him feel - yes exactly FEEL - that there is not much Value for him in a real estate project that you are offering.


    It''s a Value - the deal is lost...


    That means that you were not able to ask the right questions in the qualification stage to uncover the problem/motivation/emotional
    needs the client has and tight it up with the solution to that that he will get through the property.'
