  text: >-
    Survival is not created in panic. It's created in usefulness. So instead of asking myself what if
    everything falls apart, ask yourself, what problem can I solve today that somebody would actually
    pay for? Because in uncertain times useful people survive faster than emotional people. Of course,
    we all can be emotional. For you to survive, you don't have to be the smartest one. You just have
    to be the most useful.
