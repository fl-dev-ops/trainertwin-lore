  text: >-
    If your life changed overnight, the first thing you need is not confidence, it's a structure. Because
    when life gets unstable, confidence disappear very fast. And that's when most people start panicking,
    overthinking, scrolling, freezing, comparing. But in moments like this, you do not need to magically
    feel better first. You need just a simple next step, a move, a plan, a direction.
- t: "00:00:28"
