  description: 'At Real Estate Growth Academy, I help real estate companies in Dubai and the GCC turn underperforming sales
    teams into consistent closers.

    Most agencies struggle with the same issues:

    • new agents taking months before closing their first deal

    • cold calls that lead nowhere

    • high turnover and wasted training budgets

    I solve this by building systems that deliver measurable results:

    Agents I train typically secure their first listings within 4–6 weeks.

    Companies I work with increase conversions from calls and viewings by 20–35%.

    Retention improves because agents feel confident, supported, and productive.

    How I do it:

    Designing structured onboarding and sales training academies for agencies.

    Working directly with sales managers to set KPIs, meeting rhythms, and accountability systems.

    Coaching agents in real time — from cold-call scripts to objection handling — so they close actual deals, not just role-plays.

    Advising on process and tech to streamline operations and scale performance.

    My focus is not theory. It’s repeatable sales systems tailored for Dubai’s market — so agents close faster, managers retain
    more, and companies grow profitably.'
