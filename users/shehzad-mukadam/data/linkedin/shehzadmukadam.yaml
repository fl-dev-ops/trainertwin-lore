    description: 'Designed and delivered a 2-week, multi-track corporate training intervention for La Forêt Real Estate, covering
      10 half-day sessions across four programme areas, built around each track''s specific performance and behavioural goals:


      Sales Domination (3 half-days) – Consultative selling techniques, objection handling, negotiation mastery, and customer
      psychology, with role-play simulations to translate theory into on-the-job application.


      Leadership Excellence (3 half-days) – Leadership identity, delegation, coaching conversations, and strategic decision-making
      for team leads and first-time managers.


      Customer Service Domination (2 half-days) – Journey mapping, service recovery, emotional intelligence in client interactions,
      and NPS/CSAT-driven service culture.


      Marketing (2 half-days) – Practical marketing fundamentals aligned to real estate sales cycles, supporting lead generation
      and client engagement.


      The programme was structured using the ADDIE framework, starting with a Training Needs Analysis to identify skill gaps
      across sales, leadership, and service functions, then designing content specific to La Forêt''s client base and market
      positioning rather than using off-the-shelf material.


      Outcome: Equipped sales and leadership teams with a consistent, practical toolkit across selling, people management,
      service, and marketing - reinforcing a unified performance culture across departments.'
