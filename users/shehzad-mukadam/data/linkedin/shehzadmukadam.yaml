  about: "I help organisations turn training needs into real business results.\n \nOver the past 18+ years across the UAE,\
    \ UK, and India, I've built and led corporate training programmes - from new-hire induction and first-time manager development\
    \ to sales training and customer experience excellence - for companies in real estate, retail, FMCG, Banking, IT, AI &\
    \ robotics, and hospitality.\n \nMy approach is simple: understand what a business actually needs (through proper Training\
    \ Needs Analysis), design a programme around it using the ADDIE framework, and deliver it in a way that actually sticks\
    \ - not just a one-off workshop, but something that changes how people work.\n \nA few things I've done along the way:\n\
    \ \U0001F539 Conducted 40+ Training Needs Analyses\n \U0001F539 Trained 2000+ professionals and 1000+ students across\
    \ 100+ workshops\n \U0001F539 Built signature programmes on leadership development, sales performance, and customer experience\n\
    \ \U0001F539 Worked with brands including Marriott, Hilton, Dubai Duty Free, Philip Morris International, and La Fore't\
    \ Real Estate\n \nWhat sets me apart is that I also understand the commercial side of L&D - I've pitched training solutions\
    \ to corporate clients, worked out pricing, and even run performance marketing campaigns to generate the leads behind\
    \ those deals. That means I don't just design good training, I understand how a training function actually earns its seat\
    \ at the table.\n \nI'm currently open to Senior Trainer, L&D Specialist, and Assistant L&D Manager opportunities in the\
    \ UAE. If you're building or scaling an L&D function and want someone who can own the full cycle - from needs analysis\
    \ to delivery to impact - let's connect."
