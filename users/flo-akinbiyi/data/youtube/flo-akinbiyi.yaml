  title: The Communication Tricks That Make People Instantly Like You | Flo Akinbiyi
  upload_date: '2026-06-13'
  description: 'Communication might be the most underrated skill of the next decade — and in this episode, international presenter,
    TEDx speaker and communication coach Flo Akinbiyi breaks down exactly how the best in the world do it.

    We get into the science of charisma (and why Barack Obama scores an almost unbelievable 96%), how to use your voice as
    a tool, why most people in business sound boring, and the small, almost invisible techniques that make people instantly
    like and trust you.

    Flo shares stories from sharing the stage with Arnold Schwarzenegger, Michelle Obama and Pep Guardiola, why self-deprecating
    humour signals a mature personal brand, how to recover from mistakes in real time, and why "human-first communication"
    matters more than ever in an AI world.

    Whether you lead a team, build a brand, or just want to communicate with more impact, this one is full of practical tools
    you can use immediately.

