    description: 'About five years ago, Diego and the team at Main Division created my new logo and brand identity.


      Looking back today, I can honestly say it was one of the best investments I’ve made in my business.


      Creating a brand identity can either be a long, tiring process full of uncertainty, or it can be one of the most enjoyable
      and inspiring experiences. For me, it was definitely the second.


      What impressed me the most wasn’t just Diego’s creativity. It was the depth he went to in order to understand who I
      really am. Because my business is built around a personal brand, he didn’t just want to know what I do. He wanted to
      understand my values, my personality, what drives me, and how I want people to feel when they meet me or work with me.


      At times, it felt more like a coaching session than a branding project. And I believe that’s exactly why the outcome
      is so strong. A great brand identity is much more than a marketing exercise. It’s an authentic reflection of who you
      are.


      Five years later, I still love looking at my logo and my brand. I haven’t wanted to change a single thing, and I don’t
      see that changing anytime soon. To me, that is the biggest compliment you can give someone who creates brands.


      If you’re looking for someone who doesn’t just design a logo but takes the time to truly understand you and builds a
      brand around who you are, I can wholeheartedly recommend Diego and the entire team at Main Division.


      Thank you, Diego. It was an incredible journey, and I’m grateful for the passion, care and dedication you put into it.'
