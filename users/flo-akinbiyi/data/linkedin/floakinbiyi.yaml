    description: 'Matthias is one of those one-of-a-kind leaders.


      I’ve had the pleasure of knowing and working with him for more than eight years, both as his coach and in the role of
      a client.


      From the very beginning, one thing stood out to me: Matthias is a lifelong learner. His curiosity, the questions he
      asks, his genuine interest in people, and his constant desire to expand his knowledge are truly refreshing. Whether
      he is engaging with strangers or his own team members, he always brings that same openness and curiosity.


      But if I had to describe Matthias as a leader in one word, it would be respect.


      He knows his people. Not just the managers, but everyone, from the person cleaning the office to the most senior executives.
      He knows their names, takes a genuine interest in them, and treats everyone with the same level of dignity and respect.


      I’ve experienced that same respect when working with him as a client. He values the people around him, genuinely cares
      about their well-being, and always has their best interests at heart.


      And beyond all of that, Matthias is someone you can count on. He’s the kind of person you could call in the middle of
      the night when you need help, knowing he would be there for you.


      Matthias, keep being who you are. The world needs more leaders like you.'
