  about: "We work with:\n\nFounders who need to pitch, raise, and lead with clarity.\nCorporate leaders and employees who\
    \ need to communicate ideas that actually land.\n\nWe fix the real problem:\n\nOverthinking before you speak.\nLosing\
    \ structure under pressure.\nTurning complex ideas into something simple, sharp, and convincing.\n\nHere’s the track record:\n\
    \n- Coached 500+ founders who’ve raised millions\n- Coached 3000+ corporate leaders \n- Worked with teams at Estee Lauder,\
    \ Ericsson, Warner Bros, Amex, Netflix, Peloton, Pinterest, WPP, Toyota, Volvo, Superbet, Paysafe.\n- Background in Google\
    \ L&D\n\nWhy do I do this:\n\nEarly in my career, I struggled to express my ideas especially when the stakes were high.\n\
    \nLeading a meeting, I'd lose my train of thought. My face would get red. And I'd think, that was the most embarrassing\
    \ thing ever.\n\nI knew my stuff. It just wasn't coming across the way it should.\n\nSo what happened?\n- Less experienced\
    \ people sounded more convincing.\n- Decisions went the wrong way.\n- Opportunities slipped, not because I wasn't good\
    \ enough, but because I wasn't clear and confident enough.\n\nSo I said enough. I put myself out there. And with practice,\
    \ I started to slow down, pause, and speak more clearly.\n\nThis is why PitchNinjas was born. To make sure no one misses\
    \ out on opportunities because of the way they communicate. \n\nAlongside PitchNinjas, I support startups through advisory\
    \ roles with Google for Startups and HERmesa, helping founders refine their pitch, strengthen leadership communication,\
    \ and build teams that communicate well under pressure.\n\nOne thing became clear after all of this:\n\nPerformance, progression,\
    \ and influence rarely come down to intelligence alone. They come down to communication. If you’re tired of knowing more\
    \ than you’re able to express. Let’s fix that.\n\nSet up a 15 min call with me using my Calendly in the featured section\
    \ to learn how we can help you or your employees nail their presentations, pitch to win more deals, land hard messages\
    \ and speak with more confidence and influence."
