    description: "Accelerate2030 is multi-stakeholder program co-initiated by Impact Hub Geneva and the UNDP with a mission\
      \ to scale the impact of growth-stage ventures that contribute towards the Sustainable Development Goals (SDGs) internationally.\n\
      \nAs a nominated A2030 Coach, I play a pivotal role in sharing my knowledge and experiences with the next generation\
      \ of entrepreneurs and play a central role during the support program. In particular, I accompany one of the Finalists\
      \ in achieving their scaling goals and address the obstacles they face. Key responsibilities:\n\n- Coach. Help the startup\
      \ finalist move forward from shaping their scaling objectives to achieving their milestones\n- Learning. Question their\
      \ business model, operations and provide constructive feedback \n- Connect. Use the Accelerate2030 network to create\
      \ connections that will help the startup achieve their business objectives.\n- Support. Enable a supportive environment\
      \ for self-reflection and development of the startup's team members\n\nhttps://accelerate2030.net/2019-coaches/"
