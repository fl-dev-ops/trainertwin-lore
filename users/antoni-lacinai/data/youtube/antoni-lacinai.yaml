- id: gEiNK8kkJ74
  title: 'The Power of Listening: Be Interested, Not Interesting'
  url: https://www.youtube.com/shorts/gEiNK8kkJ74
  upload_date: '2026-10-10'
  view_count: 26
  description: 'Listening is a gift of time and attention.

    In this story, Antoni Lacinai shares a powerful lesson about active listening, empathy, and meaningful communication.

    At a sales conference, Antoni initially judged the person sitting next to him as boring and uninteresting. Instead of
    walking away, he decided to become interested instead of trying to be interesting.

    A few simple questions led to a 45-minute conversation and revealed an incredible story about helping children facing
    difficult situations at home.

    The lesson is simple: when you give someone your time and attention, you may discover a completely different person from
    the one you initially assumed.

    For leaders, managers, and professionals, better listening can create stronger relationships, deeper understanding, and
    more meaningful communication.

    #ListeningSkills #ActiveListening #LeadershipCommunication #CommunicationSkills #Leadership #Empathy #EmployeeEngagement'
  author: antonilacinaikeynotespeaker
  model: gemini-2.5-flash
  speaker_count: 1
  speakers:
    '1': Speaker 1
- id: XcBlk1KaHm0
  title: 'Active Listening: The 2nd Level of Listening Every Leader Needs'
  url: https://www.youtube.com/shorts/XcBlk1KaHm0
  upload_date: '2026-10-09'
  view_count: 38
  description: 'Active listening is the second level of listening — and it''s a major step toward better leadership communication.

    In this video, Antoni Lacinai explains how active listening helps you understand what people mean, not just what they
    say.

    You’ll learn how to:

    Ask clarifying questions

    Check your understanding

    Reflect information back to the speaker

    Avoid making assumptions

    Listen with the intention of understanding

    Simple questions like “What do you mean by that?”, “Can you give me an example?”, and “Do I understand you correctly?”
    can completely change the quality of a conversation.

    For leaders and managers, active listening is essential for building understanding, empathy, employee engagement, and
    stronger communication.

    #ActiveListening #LeadershipCommunication #ListeningSkills #CommunicationSkills #Leadership #EmployeeEngagement'
  author: antonilacinaikeynotespeaker
  model: gemini-2.5-flash
  speaker_count: 1
  speakers:
    '1': Speaker 1
- id: 6Pl1_VRtTcw
  title: You Don't Have a Strategy Problem. You Have a Communication Problem.
  url: https://www.youtube.com/shorts/6Pl1_VRtTcw
  upload_date: '2026-10-09'
  view_count: 13
  description: 'You don''t have a strategy problem. You have a communication problem dressed in a strategy suit.


    This is what I call the **Clarity Gap**.


    Even when everyone hears the same strategic message at the same time, they may not understand it in the same way. Without
    common understanding, strategy becomes harder to execute.


    The goal of leadership communication isn''t simply to make sure people hear the message.


    **It''s to make sure they get it.**


    #Leadership #LeadershipCommunication #StrategyExecution #StrategicCommunication #ClarityGap


    {leadership communication, strategic communication, strategy execution, business strategy, clarity gap, organizational
    communication, workplace communication, leadership development, employee engagement, communication strategy}'
  author: antonilacinaikeynotespeaker
  model: gemini-2.5-flash
  speaker_count: 1
