  description: "Ever since I left the corporate career I have been coaching leaders and teams worldwide, and I have found\
    \ that so many people struggle to make an impact due to low employee engagement and too many misunderstandings. \n\nThat\
    \ is why, after years of research, I developed a unique blueprint of communication insights for leaders and team members\
    \ who are fed up with not getting the results they aim for.\n\nI take a uniquely holistic approach through psychology\
    \ and communication, as opposed to my colleagues, who tend to focus on a very narrow area of expertise. I support leaders\
    \ and teams who want to be world-class communicators. This generates higher productivity and positive growth – not to\
    \ mention a lot more fun at work. Engaged employees are more productive, make fewer errors and are less absent, directly\
    \ impacting customer satisfaction and growth. \n\nHowever, only a few organizations have leaders and employees that are,\
    \ overall, truly engaged. Most leaders struggle to make a positive impact. This leads to frustration, misunderstanding,\
    \ unclear messages, roles, and mandates, which leads to an overall performance level that is way below their potential.\
    \ You might even see saboteurs who make life miserable for everyone around them.\n\nIn a keynote with me, you will get\
    \ insights on:\n- The three communication superpowers\n- Why communication is the lever to great results\n- How you easily\
    \ can become more charismatic and influential"
