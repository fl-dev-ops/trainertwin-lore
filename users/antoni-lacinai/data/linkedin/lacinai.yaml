  - title: Virtual leadership. The challenges leaders aim to overcome
    publishedAt: Amazon Kindle · Jan 30, 2021
    publishedDate:
      text: Jan 30, 2021
      month: Jan
      year: 2021
    link: https://www.amazon.com/Virtual-leadership-challenges-leaders-overcome-ebook/dp/B08W2BSYLZ/ref=sr_1_1?dchild=1&keywords=lacinai&qid=1621926685&sr=8-1
    description: 'This is a guide for you who want to elevate your virtual leadership skills.


      Antoni Lacinai, global keynote speaker and expert in leadership communication and employee engagement, asked 500 virtual
      leaders what challenges they face when leading remote teams. This is a summary of their answers; the pros and cons,
      the pitfalls and a number of powerful questions on what you can do to create high engagement in your remote teams.'
  - title: Employee engagement. 20 keys to outstanding workplace communication
    publishedAt: Lacinai AB · Jan 31, 2020
    publishedDate:
      text: Jan 31, 2020
      month: Jan
      year: 2020
    link: https://www.amazon.com/Employee-engagement-outstanding-workplace-communication/dp/9151942348/ref=sr_1_2?dchild=1&keywords=lacinai&qid=1621926803&sr=8-2
    description: 'Is it better to involve than to inform? Can you say exactly what you mean? What''s the deal with first impressions?
      Can you influence how people feel? Why is analog communication better than digital?


      In this thought-provoking book, Antoni Lacinai has gathered 20 keys - insights, tips and tools - on how best to communicate
      in our workplace when we are leading people, selling to customers or collaborating with our peers. The thesis is simple:
      Great communication leads to higher engagement, which leads to better results.


      This is a must-read if you want to create an excellent working environment, get along with your colleagues and boost
      your influence.'
  - title: Virtual meetings
    publishedAt: BoD · Jan 9, 2016
    publishedDate:
      text: Jan 9, 2016
      month: Jan
      year: 2016
    link: https://www.amazon.com/Virtual-Meetings-well-Reach-goals-ebook/dp/B06XCF7LH2/ref=sr_1_4?dchild=1&keywords=lacinai&qid=1621926803&sr=8-4
    description: 'What is the difference between a physical meeting and a virtual? What is the same? What advice can you benefit
      from that will make your virtual meetings better?


      Organisations with offices spread across locations and even time zones, will use virtual meetings as a natural part
      of their communication and leadership. This guide is for the busy manager who quickly wants to get concrete tips. It
      will give you:


      Useful advice regardless of the type of meeting

      Practical tips regardless of virtual technology

      Concrete tips (and warnings) for each technical solution'
