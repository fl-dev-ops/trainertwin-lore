    description: Som professionell föreläsare sedan 15 år känner jag mig trygg i mitt yrke, men det betyder inte att jag är
      färdig. Tvärtom strävar jag hela tiden efter att utvecklas och bli en ännu bättre talare. Under 2026 har jag anlitat
      Antoni som talarcoach och vårt samarbete har varit oerhört värdefullt för mig. Antoni lyfte fram en mängd områden jag
      redan är bra på, och satte också direkt fingret på var jag kunde göra små justeringar för att höja mig ett snäpp till,
      både vad gäller innehåll och framförande. Antoni är själv en skicklig talare och har dessutom lång erfarenhet av att
      coacha andra till att göra bättre presentationer. Det märks! Han har blick för detaljer, är snabb i tanken och full
      av kreativa idéer. Med sitt positiva och lättsamma sätt är han också rolig och inspirerande att jobba med. Jag kan varmt
      rekommendera Antoni till alla som vill utvecklas som talare!
