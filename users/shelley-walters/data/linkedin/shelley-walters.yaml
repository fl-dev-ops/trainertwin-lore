  about: 'Most sales teams already know what they should be doing. The problem is the gap between knowing and doing, and that
    gap is costing your business revenue.


    I''m Shelley Walters, CEO and Founder of The Sales Counsel. Since opening our doors in September 2016, we''ve grown by
    more than 700% by helping B2B sales teams build the capability, confidence, leadership cadence and commercial discipline
    required to sell better.

    Not just attend training. Not just enjoy a workshop. Sell better.


    Independently rated with an NPS of 78.2, placing us in the top quartile of training organisations globally. In our work
    with a leading South African bank, we delivered a nationally scaled Sales Mastery programme across 7 provinces, with 86%
    programme completion and 91% rating the service as excellent. One private banker applied our negotiation techniques within
    days and closed a R3.1 million bond, beating two of South Africa''s largest competitors in the process.


    Our clients include Mercedes-Benz Commercial Vans, Bidvest McCarthy Auto, PPS, JSE, Optix and Prestige Cleaning: organisations
    that need capability, leadership and execution to move together.


    Big Deal Readiness

    The deals that change a year rarely behave like the rest of the pipeline. Longer cycles, more stakeholders, more scrutiny.
    They are usually won or lost long before the final proposal or tender goes in. Helping teams spot, shape and land them
    is a growing part of our work.


    Our work comes in three forms:

    Keynote Speaking: I have spent 16 years on stage speaking to executive and commercial audiences on B2B sales leadership,
    big deal readiness, buyer influence and high-performance sales cultures. My keynotes are built on real commercial work,
    not theory from the sidelines.

    Revenue Consulting: our expert team partners with CEOs, Sales Directors and commercial leaders to diagnose revenue gaps,
    clarify sales roles and build the operating rhythms that drive pipeline discipline and consistent execution.

    Sales Enablement & Training: we design bespoke, modular programmes for the way B2B sales teams actually work, including
    our Sales Leadership Growth Lab. We are also the creators of Africa''s first CPD-accredited remote selling school.


    Awards and recognition: PSASA Educator Hall of Fame • PwC Gender Mainstreaming Awards: Inclusive Leader (Entrepreneur)
    and Positive Role Model


    If your team knows what to do, but it isn''t showing up consistently in the sales conversation, the pipeline or the revenue,
    that is the work we care about.


    To book a keynote or start a conversation about your team: hello@thesalescounsel.co.za'
