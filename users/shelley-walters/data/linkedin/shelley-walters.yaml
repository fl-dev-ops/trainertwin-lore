      clear-eyed about what needs to be done to improve performance.

      During our work together, Sameshan showed real discipline, resilience and operational follow-through. Sales transformation
      work is rarely simple. It requires patience, structure, honest conversations, and the ability to keep people moving
      through change. He brought all of that to the table.


      He has a gentle, credible leadership style. He does not lead through noise or ego, but through consistency, wisdom and
      a genuine willingness to support others. He is hardworking, dependable, and prepared to extend himself when the business
      or his team needs it.

      I also valued his openness to new ways of working. Implementing CRM properly requires more than a system rollout. It
      requires behavioural change, leadership reinforcement and a clear understanding of how sales activity connects to business
      results. Sameshan engaged with that process seriously and constructively.

      I would gladly recommend Sameshan as a committed, people-centred and commercially aware leader who can be trusted to
      help move a business forward.'
