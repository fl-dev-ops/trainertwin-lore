  title: Empathy, Accountability and Commercial Leadership. ShiftHappens with Loyiso Jiyana, Episode 1.
  url: https://www.youtube.com/watch?v=BAJYW9i2wro
  upload_date: '2026-08-25'
  view_count: 328
  description: 'Sales is often treated as something people simply fall into.


    And sometimes, they do.


    But staying in sales, growing through it and eventually leading others requires far more than personality or natural confidence.


    It requires discipline.


    In the first episode of The Sales Counsel, we have an honest conversation about the unexpected routes that shape our careers,
    the lessons that only experience can teach and the difficult transition from producing results yourself to delivering
    results through other people.


    We talk about what it means to create value rather than sell a commodity. Why empathy and accountability must coexist.
    Why strong sales performance does not automatically translate into strong leadership. And why women should never have
    to become less of themselves to earn authority in the room.


    There is also a truth in this conversation that I believe we need to say more often:


    Sales is not a knee-jerk business. It is a disciplined, process-driven craft.


    It can build extraordinary careers, but it will ask you to remain teachable. To earn your stripes. To receive difficult
    feedback. To understand people. To adapt when the market changes. And to keep showing up when the work becomes uncomfortable.


    This episode is for the salesperson building a career, the manager learning to lead and the business leader responsible
    for creating an environment where people can perform and grow.


    Watch the full conversation and let me know which lesson stayed with you.


    Subscribe to The Sales Counsel for more honest conversations about sales, leadership and the work behind sustainable performance.


    #TheSalesCounsel #SalesLeadership #SalesStrategy #WomenInSales #LeadershipDevelopment #SalesCareer #BusinessLeadership
    #ModernSelling #PeopleLeadership #SalesTraining #CareerGrowth #SouthAfricanBusiness'
