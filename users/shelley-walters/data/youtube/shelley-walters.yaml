  upload_date: '2026-03-11'
  view_count: 149
  description: 'Most B2B sales pipelines look healthy on the surface.


    But when you pressure-test them properly, 30–50% of the pipeline often disappears.


    In this video, Shelley Walters, Founder & CEO of The Sales Counsel, explains why pipeline forecasts break down inside
    many organisations and how leadership teams can fix the problem.


    Drawing on over a decade of working with South African businesses, Shelley breaks down:


    • The 3x pipeline coverage myth and why it often fails

    • The four pipeline lies hiding inside most CRM systems

    • Why most sales managers were never taught how to inspect pipeline properly

    • How a weekly inspection rhythm changes forecasting accuracy and revenue growth


    If you lead a B2B sales team, this video will change the way you look at your pipeline.'
